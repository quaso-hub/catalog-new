<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 600 360"
     width="100%" height="auto"
     font-family="Arial, Helvetica, sans-serif">

  <defs>
    <!-- Dimension arrow markers -->
    <marker id="dim-arrow-right" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#003366"/>
    </marker>
    <marker id="dim-arrow-left" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#003366"/>
    </marker>
    <marker id="dim-arrow-up" markerWidth="6" markerHeight="8" refX="3" refY="0" orient="auto">
      <polygon points="0 8, 3 0, 6 8" fill="#003366"/>
    </marker>
    <marker id="dim-arrow-down" markerWidth="6" markerHeight="8" refX="3" refY="8" orient="auto">
      <polygon points="0 0, 3 8, 6 0" fill="#003366"/>
    </marker>

    <!-- Hatching patterns -->
    <pattern id="hatch-metal" patternUnits="userSpaceOnUse" width="4" height="4" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#999" stroke-width="0.5"/>
    </pattern>
    <pattern id="hatch-pir" patternUnits="userSpaceOnUse" width="6" height="6">
      <circle cx="3" cy="3" r="1" fill="#e8d5a0" stroke="none"/>
      <circle cx="0" cy="0" r="0.8" fill="#e8d5a0" stroke="none"/>
      <circle cx="6" cy="6" r="0.8" fill="#e8d5a0" stroke="none"/>
      <circle cx="6" cy="0" r="0.5" fill="#e8d5a0" stroke="none"/>
      <circle cx="0" cy="6" r="0.5" fill="#e8d5a0" stroke="none"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="#ffffff"/>

  <!-- ==================== TITLE BLOCK ==================== -->
  <rect x="400" y="290" width="190" height="60" fill="none" stroke="#000" stroke-width="0.8"/>
  <line x1="400" y1="304" x2="590" y2="304" stroke="#000" stroke-width="0.5"/>
  <line x1="400" y1="316" x2="590" y2="316" stroke="#000" stroke-width="0.5"/>
  <line x1="400" y1="328" x2="590" y2="328" stroke="#000" stroke-width="0.5"/>
  <line x1="400" y1="340" x2="590" y2="340" stroke="#000" stroke-width="0.5"/>

  <text x="495" y="301" font-size="8" font-weight="bold" fill="#000" text-anchor="middle">ELFATECH - MOT CATALOG</text>
  <text x="495" y="313" font-size="7" fill="#333" text-anchor="middle">Drawing: Wall Panel Cross-Section</text>
  <text x="495" y="325" font-size="7" fill="#333" text-anchor="middle">Scale: NOT TO SCALE | Material: PIR + HRP</text>
  <text x="495" y="337" font-size="7" fill="#333" text-anchor="middle">Ref: ELF-DWG-WP-001</text>
  <text x="495" y="348" font-size="6.5" fill="#666" text-anchor="middle">Date: 2026 | Blue Scope AZ100</text>

  <!-- ==================== DRAWING TITLE ==================== -->
  <text x="240" y="22" font-size="12" font-weight="bold" fill="#000" text-anchor="middle">WALL PANEL CROSS-SECTION</text>
  <text x="240" y="34" font-size="8" fill="#333" text-anchor="middle">PIR Sandwich Panel - 3 Layer Construction</text>

  <!-- ==================== MAIN CROSS-SECTION DRAWING ==================== -->
  <!-- Drawing area: centered, panel viewed from front cross-section -->
  <!-- Scale representation: 1180mm width mapped to ~400px, 76mm height mapped to ~160px -->
  <!-- Panel total: x=40..440, y=80..240 -->

  <!-- Layer 1: HRP Outer (top) - 0.5mm -> ~1px scaled up for visibility to 4px -->
  <rect x="40" y="80" width="400" height="4" fill="#d1d5db" stroke="#000" stroke-width="0.5"/>
  <rect x="40" y="80" width="400" height="4" fill="url(#hatch-metal)" opacity="0.5"/>

  <!-- Layer 2: PIR Core - 75mm -> 152px -->
  <rect x="40" y="84" width="400" height="152" fill="#fef3c7" stroke="#000" stroke-width="0.5"/>
  <rect x="40" y="84" width="400" height="152" fill="url(#hatch-pir)" opacity="0.3"/>

  <!-- Layer 3: HRP Inner (bottom) - 0.5mm -> 4px -->
  <rect x="40" y="236" width="400" height="4" fill="#d1d5db" stroke="#000" stroke-width="0.5"/>
  <rect x="40" y="236" width="400" height="4" fill="url(#hatch-metal)" opacity="0.5"/>

  <!-- ==================== MATERIAL LABELS (left side, callout lines) ==================== -->
  <!-- HRP Outer label -->
  <line x1="40" y1="82" x2="10" y2="60" stroke="#333" stroke-width="0.3"/>
  <line x1="10" y1="60" x2="-10" y2="60" stroke="#333" stroke-width="0.3"/>
  <text x="15" y="55" font-size="6.5" fill="#333" text-anchor="end">HRP Antibacterial 0.5mm</text>
  <text x="15" y="63" font-size="5.5" fill="#666" text-anchor="end">Blue Scope AZ100</text>

  <!-- PIR Core label -->
  <line x1="40" y1="160" x2="10" y2="160" stroke="#333" stroke-width="0.3"/>
  <text x="6" y="156" font-size="6.5" fill="#333" text-anchor="end">PIR Insulation Foam</text>
  <text x="6" y="164" font-size="5.5" fill="#666" text-anchor="end">75mm core</text>

  <!-- HRP Inner label -->
  <line x1="40" y1="238" x2="10" y2="260" stroke="#333" stroke-width="0.3"/>
  <text x="15" y="266" font-size="6.5" fill="#333" text-anchor="end">HRP Antibacterial 0.5mm</text>
  <text x="15" y="274" font-size="5.5" fill="#666" text-anchor="end">Blue Scope AZ100</text>

  <!-- ==================== HORIZONTAL DIMENSION: WIDTH 1180mm ==================== -->
  <!-- Extension lines -->
  <line x1="40" y1="240" x2="40" y2="270" stroke="#003366" stroke-width="0.3"/>
  <line x1="440" y1="240" x2="440" y2="270" stroke="#003366" stroke-width="0.3"/>
  <!-- Dimension line -->
  <line x1="40" y1="265" x2="440" y2="265" stroke="#003366" stroke-width="0.4"
        marker-start="url(#dim-arrow-left)" marker-end="url(#dim-arrow-right)"/>
  <!-- Dimension text -->
  <text x="240" y="261" font-size="8" font-weight="bold" fill="#003366" text-anchor="middle">1180 mm</text>

  <!-- ==================== VERTICAL DIMENSIONS (right side) ==================== -->

  <!-- Total thickness: 76mm -->
  <!-- Extension lines -->
  <line x1="440" y1="80" x2="500" y2="80" stroke="#003366" stroke-width="0.3"/>
  <line x1="440" y1="240" x2="500" y2="240" stroke="#003366" stroke-width="0.3"/>
  <!-- Dimension line -->
  <line x1="490" y1="80" x2="490" y2="240" stroke="#003366" stroke-width="0.4"
        marker-start="url(#dim-arrow-up)" marker-end="url(#dim-arrow-down)"/>
  <!-- Dimension text (rotated) -->
  <text x="502" y="164" font-size="8" font-weight="bold" fill="#003366" transform="rotate(90, 502, 164)" text-anchor="middle">76 mm (total)</text>

  <!-- HRP Outer thickness: 0.5mm -->
  <line x1="440" y1="80" x2="465" y2="80" stroke="#003366" stroke-width="0.2"/>
  <line x1="440" y1="84" x2="465" y2="84" stroke="#003366" stroke-width="0.2"/>
  <line x1="458" y1="80" x2="458" y2="84" stroke="#003366" stroke-width="0.3"/>
  <!-- Small bracket -->
  <line x1="455" y1="80" x2="461" y2="80" stroke="#003366" stroke-width="0.3"/>
  <line x1="455" y1="84" x2="461" y2="84" stroke="#003366" stroke-width="0.3"/>
  <text x="466" y="84" font-size="6" fill="#003366">0.5</text>

  <!-- PIR Core thickness: 75mm -->
  <line x1="440" y1="84" x2="475" y2="84" stroke="#003366" stroke-width="0.2"/>
  <line x1="440" y1="236" x2="475" y2="236" stroke="#003366" stroke-width="0.2"/>
  <line x1="470" y1="84" x2="470" y2="236" stroke="#003366" stroke-width="0.4"
        marker-start="url(#dim-arrow-up)" marker-end="url(#dim-arrow-down)"/>
  <text x="478" y="164" font-size="7" fill="#003366" transform="rotate(90, 478, 164)" text-anchor="middle">75 mm</text>

  <!-- HRP Inner thickness: 0.5mm -->
  <line x1="440" y1="236" x2="465" y2="236" stroke="#003366" stroke-width="0.2"/>
  <line x1="440" y1="240" x2="465" y2="240" stroke="#003366" stroke-width="0.2"/>
  <line x1="458" y1="236" x2="458" y2="240" stroke="#003366" stroke-width="0.3"/>
  <line x1="455" y1="236" x2="461" y2="236" stroke="#003366" stroke-width="0.3"/>
  <line x1="455" y1="240" x2="461" y2="240" stroke="#003366" stroke-width="0.3"/>
  <text x="466" y="240" font-size="6" fill="#003366">0.5</text>

  <!-- ==================== HEIGHT LABEL ==================== -->
  <text x="240" y="296" font-size="7" fill="#333" text-anchor="middle">Wall Height: 3000mm (not shown to scale)</text>

  <!-- ==================== NOTES ==================== -->
  <text x="40" y="310" font-size="6" fill="#666">Notes:</text>
  <text x="40" y="320" font-size="5.5" fill="#666">1. All dimensions in millimeters (mm)</text>
  <text x="40" y="329" font-size="5.5" fill="#666">2. HRP layer thickness exaggerated for visibility (actual 0.5mm)</text>
  <text x="40" y="338" font-size="5.5" fill="#666">3. Pb 2mm lead lining optional (for X-Ray rooms)</text>
  <text x="40" y="347" font-size="5.5" fill="#666">4. Slip-Z male/female interlock joint system</text>

</svg>
