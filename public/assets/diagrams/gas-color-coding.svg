<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="100%" height="auto">
  <!-- 
    Medical Gas Color Coding - OHMEDA Standard (per spek-mot.md)
    CORRECTED COLORS per source document:
    - Oxygen = GREEN (not white)
    - Air 4 Bar = YELLOW (not black/white)
    - Vacuum = WHITE (not yellow)
    - N2O = BLUE
    - CO2 = GREY
    - AGSS = PURPLE
  -->
  
  <!-- Background -->
  <rect x="0" y="0" width="420" height="220" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="210" y="25" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" font-style="normal" fill="#003366" text-anchor="middle">MEDICAL GAS COLOR CODING</text>
  <text x="210" y="42" font-family="Inter, Arial, Helvetica, sans-serif" font-size="9" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle">OHMEDA Standard (ISO 32)</text>
  
  <!-- Table Header -->
  <rect x="20" y="55" width="380" height="25" fill="#003366"/>
  <text x="70" y="72" font-family="Inter, Arial, Helvetica, sans-serif" font-size="10" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="middle">GAS TYPE</text>
  <text x="180" y="72" font-family="Inter, Arial, Helvetica, sans-serif" font-size="10" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="middle">COLOR</text>
  <text x="280" y="72" font-family="Inter, Arial, Helvetica, sans-serif" font-size="10" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="middle">MODEL</text>
  <text x="360" y="72" font-family="Inter, Arial, Helvetica, sans-serif" font-size="10" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="middle">PRESSURE</text>
  
  <!-- Row 1: Oxygen - GREEN -->
  <rect x="20" y="80" width="380" height="22" fill="#f8fafc"/>
  <text x="70" y="95" font-family="Inter, Arial, Helvetica, sans-serif" font-size="10" font-weight="400" font-style="normal" fill="#003366" text-anchor="middle">Oxygen (O₂)</text>
  <rect x="145" y="84" width="70" height="14" fill="#22c55e" stroke="#003366" stroke-width="1"/>
  <text x="180" y="95" font-family="Inter, Arial, Helvetica, sans-serif" font-size="9" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="middle">GREEN</text>
  <text x="280" y="95" font-family="Inter, Arial, Helvetica, sans-serif" font-size="9" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle">OH-WAL-OXY</text>
  <text x="360" y="95" font-family="Inter, Arial, Helvetica, sans-serif" font-size="9" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle">4.0 bar</text>
  
  <!-- Row 2: Air 4 Bar - YELLOW -->
  <rect x="20" y="102" width="380" height="22" fill="#ffffff"/>
  <text x="70" y="117" font-family="Inter, Arial, Helvetica, sans-serif" font-size="10" font-weight="400" font-style="normal" fill="#003366" text-anchor="middle">Medical Air</text>
  <rect x="145" y="106" width="70" height="14" fill="#fbbf24" stroke="#003366" stroke-width="1"/>
  <text x="180" y="117" font-family="Inter, Arial, Helvetica, sans-serif" font-size="9" font-weight="600" font-style="normal" fill="#1a1a1a" text-anchor="middle">YELLOW</text>
  <text x="280" y="117" font-family="Inter, Arial, Helvetica, sans-serif" font-size="9" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle">OH-WAL-MA4</text>
  <text x="360" y="117" font-family="Inter, Arial, Helvetica, sans-serif" font-size="9" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle">4.0 bar</text>
  
  <!-- Row 3: Vacuum - WHITE -->
  <rect x="20" y="124" width="380" height="22" fill="#f8fafc"/>
  <text x="70" y="139" font-family="Inter, Arial, Helvetica, sans-serif" font-size="10" font-weight="400" font-style="normal" fill="#003366" text-anchor="middle">Vacuum</text>
  <rect x="145" y="128" width="70" height="14" fill="#ffffff" stroke="#003366" stroke-width="1"/>
  <text x="180" y="139" font-family="Inter, Arial, Helvetica, sans-serif" font-size="9" font-weight="600" font-style="normal" fill="#003366" text-anchor="middle">WHITE</text>
  <text x="280" y="139" font-family="Inter, Arial, Helvetica, sans-serif" font-size="9" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle">OH-WAL-VAC</text>
  <text x="360" y="139" font-family="Inter, Arial, Helvetica, sans-serif" font-size="9" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle">-0.6 bar</text>
  
  <!-- Row 4: N2O - BLUE -->
  <rect x="20" y="146" width="380" height="22" fill="#ffffff"/>
  <text x="70" y="161" font-family="Inter, Arial, Helvetica, sans-serif" font-size="10" font-weight="400" font-style="normal" fill="#003366" text-anchor="middle">Nitrous Oxide (N₂O)</text>
  <rect x="145" y="150" width="70" height="14" fill="#3b82f6" stroke="#003366" stroke-width="1"/>
  <text x="180" y="161" font-family="Inter, Arial, Helvetica, sans-serif" font-size="9" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="middle">BLUE</text>
  <text x="280" y="161" font-family="Inter, Arial, Helvetica, sans-serif" font-size="9" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle">OH-WAL-N2O</text>
  <text x="360" y="161" font-family="Inter, Arial, Helvetica, sans-serif" font-size="9" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle">4.0 bar</text>
  
  <!-- Row 5: CO2 - GREY -->
  <rect x="20" y="168" width="380" height="22" fill="#f8fafc"/>
  <text x="70" y="183" font-family="Inter, Arial, Helvetica, sans-serif" font-size="10" font-weight="400" font-style="normal" fill="#003366" text-anchor="middle">Carbon Dioxide (CO₂)</text>
  <rect x="145" y="172" width="70" height="14" fill="#6b7280" stroke="#003366" stroke-width="1"/>
  <text x="180" y="183" font-family="Inter, Arial, Helvetica, sans-serif" font-size="9" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="middle">GREY</text>
  <text x="280" y="183" font-family="Inter, Arial, Helvetica, sans-serif" font-size="9" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle">OH-WAL-CO2</text>
  <text x="360" y="183" font-family="Inter, Arial, Helvetica, sans-serif" font-size="9" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle">4.0 bar</text>
  
  <!-- Row 6: AGSS - PURPLE -->
  <rect x="20" y="190" width="380" height="22" fill="#ffffff"/>
  <text x="70" y="205" font-family="Inter, Arial, Helvetica, sans-serif" font-size="10" font-weight="400" font-style="normal" fill="#003366" text-anchor="middle">AGSS</text>
  <rect x="145" y="194" width="70" height="14" fill="#8b5cf6" stroke="#003366" stroke-width="1"/>
  <text x="180" y="205" font-family="Inter, Arial, Helvetica, sans-serif" font-size="9" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="middle">PURPLE</text>
  <text x="280" y="205" font-family="Inter, Arial, Helvetica, sans-serif" font-size="9" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle">OH-WAL-AGSS</text>
  <text x="360" y="205" font-family="Inter, Arial, Helvetica, sans-serif" font-size="9" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle">Passive</text>
  
  <!-- Border -->
  <rect x="20" y="55" width="380" height="157" fill="none" stroke="#003366" stroke-width="1"/>
</svg>
