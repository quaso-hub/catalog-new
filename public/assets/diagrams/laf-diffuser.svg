<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <pattern id="filter-screen" patternUnits="userSpaceOnUse" width="5" height="5">
      <line x1="0" y1="0" x2="0" y2="5"   stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.25"/>
      <line x1="2.5" y1="0" x2="2.5" y2="5" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.25"/>
    </pattern>
    <pattern id="diffuser-perf" patternUnits="userSpaceOnUse" width="6" height="6">
      <circle cx="3" cy="3" r="0.8" fill="rgba(255,255,255,0.3)"/>
    </pattern>
    <marker id="arr-down" markerWidth="6" markerHeight="5"
            refX="0" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#0d9488"/>
    </marker>
    <marker id="dim-arrow-l" markerWidth="6" markerHeight="4"
            refX="0" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#003366"/>
    </marker>
    <marker id="dim-arrow-r" markerWidth="6" markerHeight="4"
            refX="6" refY="2" orient="auto-start-reverse">
      <polygon points="6 0, 0 2, 6 4" fill="#003366"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="320" height="200" fill="#ffffff"/>

  <!-- AHU note (top) -->
  <text x="160" y="12" font-family="Arial, sans-serif" font-size="5"
        fill="#94a3b8" text-anchor="middle" font-style="italic">
    AHU supply duct connects to unit housing top (not shown)
  </text>

  <!-- CEILING LINE -->
  <line x1="0" y1="20" x2="320" y2="20" stroke="#0f172a" stroke-width="1.5"/>
  <text x="10" y="17" font-family="Arial, sans-serif" font-size="7"
        fill="#64748b">CEILING SLAB</text>

  <!-- LAF UNIT HOUSING -->
  <rect x="60" y="20" width="200" height="18" fill="#dde4ee" stroke="#003366" stroke-width="0.8"/>
  <text x="160" y="32" font-family="Arial, sans-serif" font-size="6"
        font-weight="bold" fill="#003366" text-anchor="middle"
        letter-spacing="0.04em">LAF UNIT HOUSING</text>

  <!-- HEPA H14 FILTER LAYER -->
  <rect x="60" y="38" width="200" height="12" fill="#003366" fill-opacity="0.85"/>
  <rect x="60" y="38" width="200" height="12" fill="url(#filter-screen)"/>
  <text x="160" y="47" font-family="Arial, sans-serif" font-size="6"
        font-weight="bold" fill="#ffffff" text-anchor="middle"
        letter-spacing="0.04em">HEPA H14 FILTER  99.995%</text>

  <!-- DIFFUSER FACE — PERFORATED -->
  <rect x="60" y="50" width="200" height="10" fill="#0d9488" fill-opacity="0.8"/>
  <rect x="60" y="50" width="200" height="10" fill="url(#diffuser-perf)"/>
  <text x="160" y="57.5" font-family="Arial, sans-serif" font-size="5.5"
        font-weight="bold" fill="#ffffff" text-anchor="middle">LAF DIFFUSER FACE  2400 × 2400 mm</text>

  <!-- DOWNFLOW ARROWS — 7 arrows -->
  <line x1="85"  y1="63" x2="85"  y2="118" stroke="#0d9488" stroke-width="0.8" marker-end="url(#arr-down)"/>
  <line x1="105" y1="63" x2="105" y2="118" stroke="#0d9488" stroke-width="0.8" marker-end="url(#arr-down)"/>
  <line x1="125" y1="63" x2="125" y2="118" stroke="#0d9488" stroke-width="0.8" marker-end="url(#arr-down)"/>
  <line x1="145" y1="63" x2="145" y2="118" stroke="#0d9488" stroke-width="0.8" marker-end="url(#arr-down)"/>
  <line x1="165" y1="63" x2="165" y2="118" stroke="#0d9488" stroke-width="0.8" marker-end="url(#arr-down)"/>
  <line x1="185" y1="63" x2="185" y2="118" stroke="#0d9488" stroke-width="0.8" marker-end="url(#arr-down)"/>
  <line x1="205" y1="63" x2="205" y2="118" stroke="#0d9488" stroke-width="0.8" marker-end="url(#arr-down)"/>

  <!-- Velocity label -->
  <rect x="130" y="85" width="60" height="10" fill="white" fill-opacity="0.85"/>
  <text x="160" y="93" font-family="Arial, sans-serif" font-size="6"
        fill="#0d9488" text-anchor="middle" font-weight="bold">0.25–0.45 m/s</text>

  <!-- SURGICAL ZONE BOX -->
  <rect x="60" y="122" width="200" height="40" fill="#0d9488" fill-opacity="0.06"
        stroke="#0d9488" stroke-width="0.6" stroke-dasharray="3,1.5"/>
  <text x="160" y="140" font-family="Arial, sans-serif" font-size="7"
        font-weight="bold" fill="#0d9488" text-anchor="middle">SURGICAL ZONE</text>
  <text x="160" y="152" font-family="Arial, sans-serif" font-size="5.5"
        fill="#0d9488" text-anchor="middle">ISO Class 5 (Class 100)</text>

  <!-- DIMENSION — 2400mm width -->
  <line x1="60"  y1="174" x2="260" y2="174" stroke="#003366" stroke-width="0.5"
        marker-start="url(#dim-arrow-r)" marker-end="url(#dim-arrow-l)"/>
  <line x1="60"  y1="170" x2="60"  y2="178" stroke="#003366" stroke-width="0.5"/>
  <line x1="260" y1="170" x2="260" y2="178" stroke="#003366" stroke-width="0.5"/>
  <text x="160" y="184" font-family="Arial, sans-serif" font-size="7"
        font-weight="bold" fill="#003366" text-anchor="middle">2400 mm</text>

  <!-- TITLE -->
  <text x="160" y="196" font-family="Arial, sans-serif" font-size="7"
        fill="#003366" text-anchor="middle">LAF Ceiling Diffuser Unit — Elevation Schematic</text>

</svg>
