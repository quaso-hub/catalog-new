<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 500 350"
     width="100%" height="auto"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

  <defs>
    <!-- Bidirectional arrow markers -->
    <marker id="arrow-teal-end" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#0d9488"/>
    </marker>
    <marker id="arrow-teal-start" markerWidth="6" markerHeight="4" refX="0" refY="2" orient="auto">
      <polygon points="6 0, 0 2, 6 4" fill="#0d9488"/>
    </marker>

    <!-- Subtle drop shadow for central hub -->
    <filter id="shadow-hub" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#001a33" flood-opacity="0.18"/>
    </filter>

    <!-- Light shadow for subsystem boxes -->
    <filter id="shadow-sub" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#003366" flood-opacity="0.08"/>
    </filter>

    <!-- Subtle gradient for central hub -->
    <linearGradient id="hub-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#004488"/>
      <stop offset="100%" stop-color="#002244"/>
    </linearGradient>

    <!-- Connection line pattern (subtle pulse dots) -->
    <linearGradient id="conn-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#0d9488" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="350" fill="#ffffff"/>

  <!-- ==================== TITLE AREA ==================== -->
  <text x="250" y="22" font-size="14" font-weight="700" fill="#003366" text-anchor="middle" letter-spacing="-0.01em">SYSTEM INTEGRATION</text>
  <text x="250" y="35" font-size="9" fill="#64748b" text-anchor="middle">Centralized Control Architecture</text>

  <!-- Thin accent line under title -->
  <line x1="200" y1="40" x2="300" y2="40" stroke="#0d9488" stroke-width="1" opacity="0.4"/>

  <!-- ==================== TOP BLOCK: Display & Timer ==================== -->
  <rect x="175" y="50" width="150" height="52" fill="#ffffff" stroke="#003366" stroke-width="1.5" rx="6" filter="url(#shadow-sub)"/>
  <!-- Top accent bar -->
  <rect x="175" y="50" width="150" height="4" fill="#003366" rx="6"/>
  <rect x="181" y="50" width="138" height="4" fill="#003366"/>
  <text x="250" y="72" font-size="10" font-weight="600" fill="#003366" text-anchor="middle">DISPLAY &amp; TIMER</text>
  <text x="250" y="84" font-size="7" fill="#64748b" text-anchor="middle">Temp | Humidity | Clock | Running Text</text>
  <text x="250" y="94" font-size="6.5" fill="#94a3b8" text-anchor="middle">Real-time Monitoring Interface</text>

  <!-- Connection: Top → Central (vertical) -->
  <line x1="250" y1="102" x2="250" y2="127" stroke="#0d9488" stroke-width="1.5"
        marker-end="url(#arrow-teal-end)" marker-start="url(#arrow-teal-start)"/>

  <!-- ==================== CENTRAL HUB: Surgical Control Panel ==================== -->
  <rect x="150" y="130" width="200" height="104" fill="url(#hub-gradient)" rx="8" filter="url(#shadow-hub)"/>
  <!-- Inner subtle highlight border -->
  <rect x="152" y="132" width="196" height="100" fill="none" stroke="#4488aa" stroke-width="0.5" rx="7" opacity="0.3"/>

  <!-- Hub icon: small grid/network symbol -->
  <rect x="232" y="140" width="4" height="4" rx="1" fill="#5eead4" opacity="0.6"/>
  <rect x="240" y="140" width="4" height="4" rx="1" fill="#5eead4" opacity="0.6"/>
  <rect x="248" y="140" width="4" height="4" rx="1" fill="#5eead4" opacity="0.6"/>
  <rect x="256" y="140" width="4" height="4" rx="1" fill="#5eead4" opacity="0.6"/>
  <rect x="264" y="140" width="4" height="4" rx="1" fill="#5eead4" opacity="0.6"/>

  <text x="250" y="160" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.03em">SURGICAL CONTROL PANEL</text>
  <line x1="180" y1="165" x2="320" y2="165" stroke="#ffffff" stroke-width="0.3" opacity="0.25"/>
  <text x="250" y="178" font-size="8" fill="#ccfbf1" text-anchor="middle">Windows Smart System</text>
  <text x="250" y="191" font-size="8" fill="#ccfbf1" text-anchor="middle">Modbus TCP/IP Protocol</text>
  <text x="250" y="204" font-size="7" fill="#99e0d5" text-anchor="middle" opacity="0.8">Switch Hub Network</text>

  <!-- Subtle corner dots on hub to indicate connectivity -->
  <circle cx="157" cy="137" r="2" fill="#0d9488" opacity="0.5"/>
  <circle cx="343" cy="137" r="2" fill="#0d9488" opacity="0.5"/>
  <circle cx="157" cy="227" r="2" fill="#0d9488" opacity="0.5"/>
  <circle cx="343" cy="227" r="2" fill="#0d9488" opacity="0.5"/>

  <!-- ==================== LEFT-TOP: Lighting ==================== -->
  <rect x="15" y="110" width="112" height="68" fill="#ffffff" stroke="#003366" stroke-width="1.2" rx="6" filter="url(#shadow-sub)"/>
  <!-- Left accent bar -->
  <rect x="15" y="110" width="4" height="68" fill="#003366" rx="2"/>
  <rect x="15" y="116" width="4" height="56" fill="#003366"/>

  <!-- Mini icon: lamp shape -->
  <circle cx="35" cy="128" r="5" fill="none" stroke="#0d9488" stroke-width="1" opacity="0.5"/>
  <line x1="35" y1="133" x2="35" y2="137" stroke="#0d9488" stroke-width="1" opacity="0.5"/>

  <text x="75" y="130" font-size="10" font-weight="600" fill="#003366" text-anchor="middle">LIGHTING</text>
  <text x="75" y="144" font-size="7.5" fill="#64748b" text-anchor="middle">Shadowless Lamp 700/700</text>
  <text x="75" y="156" font-size="7.5" fill="#64748b" text-anchor="middle">LED Room Panel</text>
  <text x="75" y="168" font-size="6.5" fill="#94a3b8" text-anchor="middle">Dimming Control</text>

  <!-- Connection: Lighting → Central -->
  <line x1="127" y1="150" x2="150" y2="160" stroke="#0d9488" stroke-width="1.5"
        marker-end="url(#arrow-teal-end)" marker-start="url(#arrow-teal-start)"/>

  <!-- ==================== LEFT-BOTTOM: HVAC ==================== -->
  <rect x="15" y="198" width="112" height="68" fill="#ffffff" stroke="#003366" stroke-width="1.2" rx="6" filter="url(#shadow-sub)"/>
  <rect x="15" y="198" width="4" height="68" fill="#0d9488" rx="2"/>
  <rect x="15" y="204" width="4" height="56" fill="#0d9488"/>

  <!-- Mini icon: wind lines -->
  <line x1="30" y1="214" x2="40" y2="214" stroke="#0d9488" stroke-width="1" opacity="0.5"/>
  <line x1="28" y1="218" x2="42" y2="218" stroke="#0d9488" stroke-width="1" opacity="0.5"/>
  <line x1="30" y1="222" x2="40" y2="222" stroke="#0d9488" stroke-width="1" opacity="0.5"/>

  <text x="75" y="218" font-size="10" font-weight="600" fill="#003366" text-anchor="middle">HVAC SYSTEM</text>
  <text x="75" y="232" font-size="7.5" fill="#64748b" text-anchor="middle">AHU + LAF Unit</text>
  <text x="75" y="244" font-size="7.5" fill="#64748b" text-anchor="middle">Temp &amp; Humidity</text>
  <text x="75" y="256" font-size="6.5" fill="#94a3b8" text-anchor="middle">Auto Climate Control</text>

  <!-- Connection: HVAC → Central -->
  <line x1="127" y1="232" x2="150" y2="210" stroke="#0d9488" stroke-width="1.5"
        marker-end="url(#arrow-teal-end)" marker-start="url(#arrow-teal-start)"/>

  <!-- ==================== RIGHT-TOP: Door Systems ==================== -->
  <rect x="373" y="110" width="112" height="68" fill="#ffffff" stroke="#003366" stroke-width="1.2" rx="6" filter="url(#shadow-sub)"/>
  <!-- Right accent bar -->
  <rect x="481" y="110" width="4" height="68" fill="#003366" rx="2"/>
  <rect x="481" y="116" width="4" height="56" fill="#003366"/>

  <!-- Mini icon: door shape -->
  <rect x="455" y="123" width="8" height="14" fill="none" stroke="#0d9488" stroke-width="1" rx="1" opacity="0.5"/>
  <circle cx="461" cy="130" r="1" fill="#0d9488" opacity="0.5"/>

  <text x="425" y="130" font-size="10" font-weight="600" fill="#003366" text-anchor="middle">DOOR SYSTEMS</text>
  <text x="425" y="144" font-size="7.5" fill="#64748b" text-anchor="middle">Hermetic Sliding Door</text>
  <text x="425" y="156" font-size="7.5" fill="#64748b" text-anchor="middle">Auto Swing Door</text>
  <text x="425" y="168" font-size="6.5" fill="#94a3b8" text-anchor="middle">Interlock System</text>

  <!-- Connection: Central → Door -->
  <line x1="350" y1="160" x2="373" y2="150" stroke="#0d9488" stroke-width="1.5"
        marker-end="url(#arrow-teal-end)" marker-start="url(#arrow-teal-start)"/>

  <!-- ==================== RIGHT-BOTTOM: Medical Gas ==================== -->
  <rect x="373" y="198" width="112" height="68" fill="#ffffff" stroke="#003366" stroke-width="1.2" rx="6" filter="url(#shadow-sub)"/>
  <rect x="481" y="198" width="4" height="68" fill="#0d9488" rx="2"/>
  <rect x="481" y="204" width="4" height="56" fill="#0d9488"/>

  <!-- Mini icon: gas circle -->
  <circle cx="458" cy="216" r="5" fill="none" stroke="#0d9488" stroke-width="1" opacity="0.5"/>
  <text x="458" y="218.5" font-size="5" fill="#0d9488" text-anchor="middle" opacity="0.5">O&#x2082;</text>

  <text x="425" y="218" font-size="10" font-weight="600" fill="#003366" text-anchor="middle">MEDICAL GAS</text>
  <text x="425" y="232" font-size="7.5" fill="#64748b" text-anchor="middle">O&#x2082; Air Vac N&#x2082;O CO&#x2082;</text>
  <text x="425" y="244" font-size="7.5" fill="#64748b" text-anchor="middle">AGSS Monitoring</text>
  <text x="425" y="256" font-size="6.5" fill="#94a3b8" text-anchor="middle">OHMEDA Standard</text>

  <!-- Connection: Central → Medical Gas -->
  <line x1="350" y1="210" x2="373" y2="232" stroke="#0d9488" stroke-width="1.5"
        marker-end="url(#arrow-teal-end)" marker-start="url(#arrow-teal-start)"/>

  <!-- ==================== BOTTOM: Communication ==================== -->
  <rect x="175" y="270" width="150" height="44" fill="#ffffff" stroke="#003366" stroke-width="1.5" rx="6" filter="url(#shadow-sub)"/>
  <!-- Bottom accent bar -->
  <rect x="175" y="310" width="150" height="4" fill="#003366" rx="6"/>
  <rect x="181" y="310" width="138" height="4" fill="#003366"/>

  <text x="250" y="289" font-size="10" font-weight="600" fill="#003366" text-anchor="middle">COMMUNICATION</text>
  <text x="250" y="302" font-size="7.5" fill="#64748b" text-anchor="middle">Intercom | Nurse Call | Running Text</text>

  <!-- Connection: Central → Communication (vertical) -->
  <line x1="250" y1="234" x2="250" y2="270" stroke="#0d9488" stroke-width="1.5"
        marker-end="url(#arrow-teal-end)" marker-start="url(#arrow-teal-start)"/>

  <!-- ==================== FOOTER ==================== -->
  <text x="250" y="336" font-size="7" fill="#94a3b8" text-anchor="middle">All systems communicate via Modbus TCP/IP protocol</text>

  <!-- Subtle brand accent line at bottom -->
  <line x1="170" y1="342" x2="330" y2="342" stroke="#0d9488" stroke-width="0.5" opacity="0.3"/>

</svg>
