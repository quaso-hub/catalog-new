<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280">
  <!-- Wall Panel PIR 75mm - Cross Section View -->

  <!-- Background -->
  <rect x="0" y="0" width="480" height="280" fill="#ffffff"/>

  <!-- Title -->
  <text x="200" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#003366" text-anchor="middle">WALL PANEL PIR 75mm</text>
  <text x="200" y="42" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Cross Section View</text>

  <!-- Top HRP Layer -->
  <rect x="60" y="60" width="280" height="20" fill="#e2e8f0" stroke="#003366" stroke-width="1"/>
  <pattern id="antimicrobial" patternUnits="userSpaceOnUse" width="8" height="8">
    <path d="M0,4 L8,4" stroke="#0d9488" stroke-width="0.5" opacity="0.5"/>
  </pattern>
  <rect x="60" y="60" width="280" height="20" fill="url(#antimicrobial)"/>
  <text x="355" y="73" font-family="Arial, sans-serif" font-size="9" fill="#003366" text-anchor="start">&#x2190; HRP 0.5mm</text>
  <text x="355" y="83" font-family="Arial, sans-serif" font-size="8" fill="#0d9488" text-anchor="start">(Antibacterial - Blue Scope)</text>

  <!-- PIR Core -->
  <rect x="60" y="80" width="280" height="100" fill="#fef3c7" stroke="#003366" stroke-width="1"/>
  <text x="200" y="125" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#003366" text-anchor="middle">PIR FOAM CORE</text>
  <text x="200" y="145" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">50 / 75 / 100mm thickness options</text>

  <!-- Dimension line for 75mm -->
  <line x1="45" y1="60" x2="45" y2="180" stroke="#003366" stroke-width="1"/>
  <line x1="40" y1="60" x2="50" y2="60" stroke="#003366" stroke-width="1"/>
  <line x1="40" y1="180" x2="50" y2="180" stroke="#003366" stroke-width="1"/>
  <text x="30" y="125" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#003366" text-anchor="middle" transform="rotate(-90, 30, 125)">75mm</text>

  <!-- Bottom HRP Layer -->
  <rect x="60" y="180" width="280" height="20" fill="#e2e8f0" stroke="#003366" stroke-width="1"/>
  <rect x="60" y="180" width="280" height="20" fill="url(#antimicrobial)"/>
  <text x="355" y="193" font-family="Arial, sans-serif" font-size="9" fill="#003366" text-anchor="start">&#x2190; HRP 0.5mm</text>

  <!-- Width dimension -->
  <line x1="60" y1="215" x2="340" y2="215" stroke="#003366" stroke-width="1"/>
  <line x1="60" y1="210" x2="60" y2="220" stroke="#003366" stroke-width="1"/>
  <line x1="340" y1="210" x2="340" y2="220" stroke="#003366" stroke-width="1"/>
  <text x="200" y="230" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#003366" text-anchor="middle">1180mm</text>

  <!-- Legend -->
  <rect x="60" y="250" width="15" height="10" fill="#e2e8f0" stroke="#003366" stroke-width="0.5"/>
  <text x="80" y="258" font-family="Arial, sans-serif" font-size="8" fill="#64748b">HRP Antibacterial Coating (Blue Scope)</text>

  <rect x="260" y="250" width="15" height="10" fill="#fef3c7" stroke="#003366" stroke-width="0.5"/>
  <text x="280" y="258" font-family="Arial, sans-serif" font-size="8" fill="#64748b">PIR Insulation</text>
</svg>
