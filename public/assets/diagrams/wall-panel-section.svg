<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 240" width="460" height="240">
  <defs>
    <!-- HRP steel skin pattern (diagonal lines = metal/steel convention) -->
    <pattern id="hrp-pattern" patternUnits="userSpaceOnUse" width="6" height="6">
      <line x1="0" y1="6" x2="6" y2="0" stroke="#5589aa" stroke-width="0.5"
            stroke-opacity="0.4"/>
    </pattern>
    <!-- PIR foam pattern (horizontal lines = insulation convention) -->
    <pattern id="pir-pattern" patternUnits="userSpaceOnUse" width="8" height="8">
      <line x1="0" y1="4" x2="8" y2="4" stroke="#b8860b" stroke-width="0.4"
            stroke-opacity="0.25"/>
    </pattern>
    <!-- Dimension arrowhead -->
    <marker id="dim-arrow" markerWidth="6" markerHeight="4"
            refX="0" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#003366"/>
    </marker>
    <marker id="dim-arrow-r" markerWidth="6" markerHeight="4"
            refX="6" refY="2" orient="auto-start-reverse">
      <polygon points="6 0, 0 2, 6 4" fill="#003366"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="460" height="240" fill="#ffffff"/>

  <!-- Title block (centred on 460px width) -->
  <text x="230" y="20" font-family="Arial, sans-serif" font-size="12"
        font-weight="bold" fill="#003366" text-anchor="middle"
        letter-spacing="0.05em">WALL PANEL PIR 75mm</text>
  <text x="230" y="33" font-family="Arial, sans-serif" font-size="9"
        fill="#64748b" text-anchor="middle">Cross-Section View — Scale Nominal</text>
  <line x1="50" y1="37" x2="410" y2="37" stroke="#003366" stroke-width="0.5"/>

  <!-- TOP HRP Layer (0.5mm steel skin) -->
  <rect x="60" y="48" width="240" height="18" fill="#dce8f0" stroke="#003366"
        stroke-width="0.8"/>
  <rect x="60" y="48" width="240" height="18" fill="url(#hrp-pattern)"/>

  <!-- PIR Core -->
  <rect x="60" y="66" width="240" height="90" fill="#fef5dc" stroke="#003366"
        stroke-width="0.8"/>
  <rect x="60" y="66" width="240" height="90" fill="url(#pir-pattern)"/>
  <text x="180" y="108" font-family="Arial, sans-serif" font-size="11"
        font-weight="bold" fill="#003366" text-anchor="middle"
        letter-spacing="0.03em">PIR FOAM CORE</text>
  <text x="180" y="122" font-family="Arial, sans-serif" font-size="9"
        fill="#64748b" text-anchor="middle">75mm (standard)</text>

  <!-- BOTTOM HRP Layer (0.5mm steel skin) -->
  <rect x="60" y="156" width="240" height="18" fill="#dce8f0" stroke="#003366"
        stroke-width="0.8"/>
  <rect x="60" y="156" width="240" height="18" fill="url(#hrp-pattern)"/>

  <!-- Vertical dimension — 75mm with ticks -->
  <line x1="42" y1="48"  x2="42" y2="174" stroke="#003366" stroke-width="0.7"/>
  <line x1="38" y1="48"  x2="52" y2="48"  stroke="#003366" stroke-width="0.5"/>
  <line x1="38" y1="174" x2="52" y2="174" stroke="#003366" stroke-width="0.5"/>
  <text x="26" y="116" font-family="Arial, sans-serif" font-size="10"
        font-weight="bold" fill="#003366" text-anchor="middle"
        transform="rotate(-90, 26, 116)">75mm</text>

  <!-- Width dimension — 1180mm -->
  <line x1="60"  y1="188" x2="300" y2="188" stroke="#003366" stroke-width="0.7"/>
  <line x1="60"  y1="184" x2="60"  y2="192" stroke="#003366" stroke-width="0.5"/>
  <line x1="300" y1="184" x2="300" y2="192" stroke="#003366" stroke-width="0.5"/>
  <text x="180" y="200" font-family="Arial, sans-serif" font-size="10"
        font-weight="bold" fill="#003366" text-anchor="middle">1180mm</text>

  <!-- Callout: Top HRP annotation with leader line (extended right margin) -->
  <line x1="300" y1="57"  x2="330" y2="57"  stroke="#003366" stroke-width="0.5"/>
  <line x1="330" y1="57"  x2="330" y2="53"  stroke="#003366" stroke-width="0.5"/>
  <text x="334" y="54" font-family="Arial, sans-serif" font-size="8"
        fill="#003366">HRP 0.5mm Steel Skin</text>
  <text x="334" y="63" font-family="Arial, sans-serif" font-size="7.5"
        fill="#0d9488">(Antibacterial — Blue Scope)</text>

  <!-- Callout: Bottom HRP annotation -->
  <line x1="300" y1="165" x2="330" y2="165" stroke="#003366" stroke-width="0.5"/>
  <text x="334" y="168" font-family="Arial, sans-serif" font-size="8"
        fill="#003366">HRP 0.5mm Steel Skin</text>

  <!-- Legend -->
  <rect x="60"  y="214" width="12" height="8" fill="#dce8f0" stroke="#003366"
        stroke-width="0.4"/>
  <rect x="60"  y="214" width="12" height="8" fill="url(#hrp-pattern)"/>
  <text x="75"  y="221" font-family="Arial, sans-serif" font-size="8"
        fill="#333">HRP Antibacterial Steel (Blue Scope)</text>

  <rect x="240" y="214" width="12" height="8" fill="#fef5dc" stroke="#003366"
        stroke-width="0.4"/>
  <rect x="240" y="214" width="12" height="8" fill="url(#pir-pattern)"/>
  <text x="255" y="221" font-family="Arial, sans-serif" font-size="8"
        fill="#333">PIR Insulation Core</text>
</svg>
