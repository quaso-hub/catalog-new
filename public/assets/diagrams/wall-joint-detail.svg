<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 300 200"
     width="100%" height="auto"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

  <defs>
    <marker id="arrow-navy" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#003366"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Title -->
  <text x="150" y="18" font-size="14" font-weight="700" fill="#003366" text-anchor="middle">WALL JOINT DETAIL &#x2014; SLIP-Z</text>
  <text x="150" y="30" font-size="8" fill="#64748b" text-anchor="middle">Cross-Section: Two Panels Meeting at Slip-Z Joint</text>

  <!-- ==================== Left Panel ==================== -->
  <!-- HRP top layer (left) -->
  <rect x="15" y="50" width="115" height="8" fill="#e2e8f0" stroke="#003366" stroke-width="1"/>
  <!-- PIR core (left) -->
  <rect x="15" y="58" width="115" height="60" fill="#fef3c7" stroke="#003366" stroke-width="1"/>
  <text x="72" y="90" font-size="9" font-weight="600" fill="#003366" text-anchor="middle">PIR CORE</text>
  <text x="72" y="102" font-size="7" fill="#64748b" text-anchor="middle">75mm</text>
  <!-- HRP bottom layer (left) -->
  <rect x="15" y="118" width="115" height="8" fill="#e2e8f0" stroke="#003366" stroke-width="1"/>

  <!-- Slip-Z Male profile (right edge of left panel) -->
  <!-- The male profile protrudes to the right -->
  <rect x="130" y="62" width="8" height="52" fill="#e2e8f0" stroke="#003366" stroke-width="1"/>
  <!-- Step detail -->
  <rect x="130" y="72" width="12" height="32" fill="#d1d5db" stroke="#003366" stroke-width="0.8"/>

  <!-- ==================== Right Panel ==================== -->
  <!-- HRP top layer (right) -->
  <rect x="158" y="50" width="115" height="8" fill="#e2e8f0" stroke="#003366" stroke-width="1"/>
  <!-- PIR core (right) -->
  <rect x="158" y="58" width="115" height="60" fill="#fef3c7" stroke="#003366" stroke-width="1"/>
  <text x="215" y="90" font-size="9" font-weight="600" fill="#003366" text-anchor="middle">PIR CORE</text>
  <text x="215" y="102" font-size="7" fill="#64748b" text-anchor="middle">75mm</text>
  <!-- HRP bottom layer (right) -->
  <rect x="158" y="118" width="115" height="8" fill="#e2e8f0" stroke="#003366" stroke-width="1"/>

  <!-- Slip-Z Female profile (left edge of right panel) -->
  <!-- The female profile has a groove -->
  <rect x="148" y="62" width="10" height="52" fill="#e2e8f0" stroke="#003366" stroke-width="1"/>
  <!-- Step detail (groove) -->
  <rect x="145" y="72" width="13" height="32" fill="#d1d5db" stroke="#003366" stroke-width="0.8"/>

  <!-- ==================== Joint line (center) ==================== -->
  <line x1="143" y1="45" x2="143" y2="132" stroke="#0d9488" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- ==================== Labels ==================== -->
  <!-- Slip-Z Male label -->
  <line x1="134" y1="135" x2="134" y2="145" stroke="#003366" stroke-width="0.5"/>
  <line x1="134" y1="145" x2="100" y2="145" stroke="#003366" stroke-width="0.5" marker-end="url(#arrow-navy)"/>
  <text x="100" y="153" font-size="8" font-weight="600" fill="#003366" text-anchor="middle">Slip-Z Male</text>

  <!-- Slip-Z Female label -->
  <line x1="153" y1="135" x2="153" y2="145" stroke="#003366" stroke-width="0.5"/>
  <line x1="153" y1="145" x2="190" y2="145" stroke="#003366" stroke-width="0.5" marker-end="url(#arrow-navy)"/>
  <text x="190" y="153" font-size="8" font-weight="600" fill="#003366" text-anchor="middle">Slip-Z Female</text>

  <!-- HRP label -->
  <text x="15" y="45" font-size="7" fill="#64748b">HRP 0.5mm</text>

  <!-- Airtight Seal label -->
  <text x="143" y="42" font-size="7" font-weight="600" fill="#0d9488" text-anchor="middle">Airtight Seal</text>

  <!-- ==================== Bottom notes ==================== -->
  <text x="150" y="170" font-size="8" fill="#003366" text-anchor="middle" font-weight="600">No exposed fasteners</text>
  <text x="150" y="182" font-size="7" fill="#64748b" text-anchor="middle">Panel: PIR 75mm + HRP 0.5mm (Antibacterial Blue Scope)</text>
  <text x="150" y="194" font-size="7" fill="#64748b" text-anchor="middle" font-style="italic">Illustration &#x2014; not to scale</text>

</svg>
