<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 500 180"
     width="100%" height="auto"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

  <defs>
    <marker id="arrow-teal" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d9488"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Title -->
  <text x="250" y="20" font-size="14" font-weight="700" fill="#003366" text-anchor="middle">MEDICAL GAS PIPING SCHEMATIC</text>
  <text x="250" y="34" font-size="9" fill="#64748b" text-anchor="middle">Simplified Horizontal Flow &#x2014; ASTM B-819 Copper Pipeline</text>

  <!-- ==================== Horizontal Flow ==================== -->

  <!-- Box 1: Manifold -->
  <rect x="10" y="55" width="100" height="55" fill="#f1f5f9" stroke="#003366" stroke-width="1.5" rx="4"/>
  <text x="60" y="73" font-size="9" font-weight="600" fill="#003366" text-anchor="middle">MANIFOLD</text>
  <text x="60" y="85" font-size="7" fill="#64748b" text-anchor="middle">200 bar &#x2192; 0-12 bar</text>
  <text x="60" y="96" font-size="7" fill="#64748b" text-anchor="middle">100 m&#xB3;/h max</text>

  <!-- Arrow → -->
  <line x1="110" y1="82" x2="130" y2="82" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrow-teal)"/>

  <!-- Pipeline representation (thick line with label) -->
  <line x1="135" y1="82" x2="195" y2="82" stroke="#b8860b" stroke-width="3"/>
  <rect x="140" y="65" width="50" height="13" fill="white" opacity="0.9" rx="2"/>
  <text x="165" y="74" font-size="7" fill="#64748b" text-anchor="middle">ASTM B-819</text>
  <text x="165" y="97" font-size="7" fill="#64748b" text-anchor="middle">Cu 1/2"-1 1/8"</text>

  <!-- Arrow → -->
  <line x1="195" y1="82" x2="210" y2="82" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrow-teal)"/>

  <!-- Box 2: Zone Valve -->
  <rect x="215" y="55" width="100" height="55" fill="#f1f5f9" stroke="#003366" stroke-width="1.5" rx="4"/>
  <text x="265" y="73" font-size="9" font-weight="600" fill="#003366" text-anchor="middle">ZONE VALVE</text>
  <text x="265" y="85" font-size="7" fill="#64748b" text-anchor="middle">5-GAS | ZV-XXXXX</text>
  <text x="265" y="96" font-size="7" fill="#64748b" text-anchor="middle">450&#xD7;775&#xD7;103 mm</text>

  <!-- Arrow → -->
  <line x1="315" y1="82" x2="335" y2="82" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrow-teal)"/>

  <!-- Box 3: Alarm -->
  <rect x="340" y="55" width="70" height="55" fill="#f1f5f9" stroke="#003366" stroke-width="1.5" rx="4"/>
  <text x="375" y="73" font-size="9" font-weight="600" fill="#003366" text-anchor="middle">ALARM</text>
  <text x="375" y="85" font-size="7" fill="#64748b" text-anchor="middle">LED Display</text>
  <text x="375" y="96" font-size="7" fill="#64748b" text-anchor="middle">&#xB1;1.5% acc.</text>

  <!-- Arrow → -->
  <line x1="410" y1="82" x2="425" y2="82" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrow-teal)"/>

  <!-- Box 4: Outlets -->
  <rect x="430" y="55" width="60" height="55" fill="#0d9488" stroke="#003366" stroke-width="1.5" rx="4"/>
  <text x="460" y="73" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">OUTLETS</text>
  <text x="460" y="86" font-size="7" fill="#ccfbf1" text-anchor="middle">OHMEDA</text>
  <text x="460" y="97" font-size="7" fill="#ccfbf1" text-anchor="middle">6 Gas Types</text>

  <!-- ==================== Gas Color Legend (bottom) ==================== -->
  <!-- 6 small color squares -->
  <rect x="55" y="130" width="14" height="14" fill="#22c55e" stroke="#003366" stroke-width="0.5" rx="2"/>
  <text x="62" y="155" font-size="7" fill="#64748b" text-anchor="middle">O&#x2082;</text>

  <rect x="115" y="130" width="14" height="14" fill="#fbbf24" stroke="#003366" stroke-width="0.5" rx="2"/>
  <text x="122" y="155" font-size="7" fill="#64748b" text-anchor="middle">Air</text>

  <rect x="175" y="130" width="14" height="14" fill="#ffffff" stroke="#003366" stroke-width="1" rx="2"/>
  <text x="182" y="155" font-size="7" fill="#64748b" text-anchor="middle">Vac</text>

  <rect x="235" y="130" width="14" height="14" fill="#3b82f6" stroke="#003366" stroke-width="0.5" rx="2"/>
  <text x="242" y="155" font-size="7" fill="#64748b" text-anchor="middle">N&#x2082;O</text>

  <rect x="295" y="130" width="14" height="14" fill="#6b7280" stroke="#003366" stroke-width="0.5" rx="2"/>
  <text x="302" y="155" font-size="7" fill="#64748b" text-anchor="middle">CO&#x2082;</text>

  <rect x="355" y="130" width="14" height="14" fill="#8b5cf6" stroke="#003366" stroke-width="0.5" rx="2"/>
  <text x="362" y="155" font-size="7" fill="#64748b" text-anchor="middle">AGSS</text>

  <text x="250" y="175" font-size="8" fill="#64748b" text-anchor="middle" font-style="italic">OHMEDA Standard Color Coding (ISO 32)</text>

</svg>
