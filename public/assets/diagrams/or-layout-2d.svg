<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 165" width="100%" height="auto">
  <defs>
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#e8eaed" stroke-width="0.2"/>
    </pattern>
    <pattern id="laf-hatch" width="6" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="6" x2="6" y2="0" stroke="#0d9488" stroke-width="0.3" stroke-opacity="0.18"/>
    </pattern>
    <style>
      .t-base  { font-family: Arial, Helvetica, sans-serif; }
      .t-dim   { font-size: 3.5px; fill: #666; }
      .wall-panel { fill: #dde4ee; stroke: #5a7a99; stroke-width: 0.5; }
      .wall-joint { stroke: #8aaccf; stroke-width: 0.25; fill: none; }
      .equip      { fill: #eef2f8; stroke: #003366; stroke-width: 0.6; }
      .door-fill  { fill: #d0eaf5; stroke: #2a6fa8; stroke-width: 0.5; }
      .door-arc   { fill: none; stroke: #2a6fa8; stroke-width: 0.4; stroke-dasharray: 1.5,0.6; }
    </style>
  </defs>

  <!-- Floor background -->
  <rect x="14" y="14" width="130" height="130" fill="url(#grid)"/>

  <!-- Outer room wall (heaviest line weight) -->
  <rect x="14" y="14" width="130" height="130"
        fill="none" stroke="#0f172a" stroke-width="2" stroke-linejoin="miter"/>

  <!-- Wall panels — North -->
  <rect x="14" y="14" width="130" height="4" class="wall-panel"/>
  <line x1="38"  y1="14" x2="38"  y2="18" class="wall-joint"/>
  <line x1="62"  y1="14" x2="62"  y2="18" class="wall-joint"/>
  <line x1="86"  y1="14" x2="86"  y2="18" class="wall-joint"/>
  <line x1="110" y1="14" x2="110" y2="18" class="wall-joint"/>

  <!-- Wall panels — South (gap 52–84) -->
  <rect x="14"  y="140" width="38" height="4" class="wall-panel"/>
  <rect x="84"  y="140" width="60" height="4" class="wall-panel"/>

  <!-- Wall panels — West (gap 50–68) -->
  <rect x="14"  y="18"  width="4" height="32" class="wall-panel"/>
  <rect x="14"  y="68"  width="4" height="72" class="wall-panel"/>

  <!-- Wall panels — East (gap 40–72) -->
  <rect x="140" y="18"  width="4" height="22" class="wall-panel"/>
  <rect x="140" y="72"  width="4" height="68" class="wall-panel"/>

  <!-- LAF Zone (ISO Class 5) -->
  <rect x="48" y="44" width="62" height="62" fill="#0d9488" fill-opacity="0.06"/>
  <rect x="48" y="44" width="62" height="62" fill="url(#laf-hatch)"/>
  <rect x="48" y="44" width="62" height="62"
        fill="none" stroke="#0d9488" stroke-width="0.8" stroke-dasharray="3,1.5"/>
  <rect x="54" y="36.5" width="50" height="7" fill="#0d9488" rx="1"/>
  <text x="79" y="42" text-anchor="middle" class="t-base"
        font-size="4px" fill="#ffffff" font-weight="700" letter-spacing="0.04em">LAMINAR ZONE  ISO Cl.5</text>

  <!-- Operating Table -->
  <rect x="54" y="63" width="50" height="14" class="equip" rx="0.5"/>
  <line x1="98" y1="64" x2="98" y2="76" stroke="#003366" stroke-width="0.5"/>
  <rect x="96" y="67" width="5" height="6" fill="#d8e4f0" stroke="#003366" stroke-width="0.3"/>

  <!-- Shadowless Lamps (×2) -->
  <circle cx="68" cy="57" r="5.5" fill="#fff9e8" stroke="#b8860b" stroke-width="0.7"/>
  <circle cx="68" cy="57" r="2.5" fill="#ffd54f"/>
  <circle cx="90" cy="57" r="5.5" fill="#fff9e8" stroke="#b8860b" stroke-width="0.7"/>
  <circle cx="90" cy="57" r="2.5" fill="#ffd54f"/>

  <!-- Medical Pendants — ceiling symbols only -->
  <circle cx="29" cy="22" r="5" fill="white" fill-opacity="0.4"
          stroke="#003366" stroke-width="0.5" stroke-dasharray="1.5,0.7"/>
  <line x1="27" y1="22" x2="31" y2="22" stroke="#003366" stroke-width="0.5"/>
  <line x1="29" y1="20" x2="29" y2="24" stroke="#003366" stroke-width="0.5"/>
  <circle cx="129" cy="22" r="5" fill="white" fill-opacity="0.4"
          stroke="#003366" stroke-width="0.5" stroke-dasharray="1.5,0.7"/>
  <line x1="127" y1="22" x2="131" y2="22" stroke="#003366" stroke-width="0.5"/>
  <line x1="129" y1="20" x2="129" y2="24" stroke="#003366" stroke-width="0.5"/>

  <!-- Control Panel — N wall left zone -->
  <rect x="20" y="18" width="14" height="7.5" class="equip" rx="0.3"/>
  <rect x="21.5" y="19.5" width="11" height="4.5" fill="#003366" rx="0.2" fill-opacity="0.8"/>

  <!-- X-Ray Viewer — N wall centre zone -->
  <rect x="46" y="18" width="22" height="7.5" class="equip" rx="0.3"/>
  <rect x="47.5" y="19.5" width="8.5" height="4.5" fill="#dff0f8"
        stroke="#003366" stroke-width="0.3" rx="0.2"/>
  <rect x="58"   y="19.5" width="8.5" height="4.5" fill="#dff0f8"
        stroke="#003366" stroke-width="0.3" rx="0.2"/>

  <!-- Main Entry Door — South wall, biparting hermetic -->
  <rect x="52" y="140" width="32" height="4" class="door-fill"/>
  <path d="M 62,142 L 56,142" stroke="#2a6fa8" stroke-width="0.6"
        fill="none" stroke-linecap="round"/>
  <polygon points="56,142 59,140.6 59,143.4" fill="#2a6fa8"/>
  <path d="M 74,142 L 80,142" stroke="#2a6fa8" stroke-width="0.6"
        fill="none" stroke-linecap="round"/>
  <polygon points="80,142 77,140.6 77,143.4" fill="#2a6fa8"/>
  <text x="68" y="150" text-anchor="middle" class="t-base t-dim">Main Entry</text>

  <!-- Emergency Door — West wall, single swing -->
  <rect x="14" y="50" width="4" height="18" class="door-fill"/>
  <path d="M 18 50 A 18 18 0 0 1 18 68" class="door-arc"/>

  <!-- Sterile Supply Door — East wall -->
  <rect x="140" y="40" width="4" height="32" class="door-fill"/>
  <line x1="140" y1="44" x2="140" y2="40" stroke="#2a6fa8" stroke-width="0.4"
        stroke-dasharray="1,0.5"/>
  <line x1="140" y1="68" x2="140" y2="72" stroke="#2a6fa8" stroke-width="0.4"
        stroke-dasharray="1,0.5"/>
  <text x="152" y="56" text-anchor="middle" class="t-base t-dim"
        font-size="4px" transform="rotate(90,152,56)">Sterile Access</text>

  <!-- Scale bar -->
  <line x1="14" y1="158" x2="40" y2="158" stroke="#666" stroke-width="0.6"/>
  <line x1="14" y1="156" x2="14" y2="160" stroke="#666" stroke-width="0.6"/>
  <line x1="40" y1="156" x2="40" y2="160" stroke="#666" stroke-width="0.6"/>
  <text x="27" y="163" text-anchor="middle" class="t-base t-dim">2 m</text>

</svg>
