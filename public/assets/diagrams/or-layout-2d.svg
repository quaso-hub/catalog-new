<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 175" width="100%" height="auto">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M 6 0 L 0 0 0 6" fill="none" stroke="#ebebeb" stroke-width="0.15"/>
    </pattern>
    <!-- Laminar Flow Pattern (vertical lines) -->
    <pattern id="laminar-fill" width="3" height="3" patternUnits="userSpaceOnUse">
      <line x1="1.5" y1="0" x2="1.5" y2="3" stroke="#0d9488" stroke-width="0.25" stroke-opacity="0.18"/>
    </pattern>
    <!-- Arrow Markers -->
    <marker id="arrow-teal" markerWidth="5" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 5 2, 0 4" fill="#0d9488"/>
    </marker>
    <style>
      .wall-outer { fill: none; stroke: #1a1a1a; stroke-width: 1.4; }
      .wall-fill  { fill: #f0f2f5; stroke: #003366; stroke-width: 0.7; }
      .equipment  { fill: #f5f5f5; stroke: #003366; stroke-width: 0.6; }
      .equip-dark { fill: #003366; stroke: #003366; stroke-width: 0.3; }
      .door       { fill: #daeef8; stroke: #003366; stroke-width: 0.5; }
      .door-arc   { fill: none; stroke: #003366; stroke-width: 0.4; stroke-dasharray: 1.5,0.5; }
      .laminar    { fill: url(#laminar-fill); stroke: #0d9488; stroke-width: 0.6;
                    stroke-dasharray: 2.5,1; }
      .dim-line   { stroke: #888; stroke-width: 0.25; }
      .label      { font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
                    font-size: 4.5px; fill: #1a1a1a; font-weight: 500; }
      .label-sm   { font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
                    font-size: 3.8px; fill: #555; }
      .label-zone { font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
                    font-size: 5px; fill: #0d9488; font-weight: 700;
                    letter-spacing: 0.05em; }
      .label-eq   { font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
                    font-size: 4px; fill: #003366; font-weight: 600; }
    </style>
  </defs>

  <!-- Room background with grid -->
  <rect x="10" y="8" width="120" height="120" fill="url(#grid)"/>

  <!-- Room outer wall -->
  <rect x="10" y="8" width="120" height="120" class="wall-outer"/>

  <!-- Wall panels - North (with joint lines) -->
  <rect x="10" y="8"  width="120" height="3.5" class="wall-fill"/>
  <line x1="34" y1="8"  x2="34" y2="11.5"  stroke="#6a88aa" stroke-width="0.3"/>
  <line x1="58" y1="8"  x2="58" y2="11.5"  stroke="#6a88aa" stroke-width="0.3"/>
  <line x1="82" y1="8"  x2="82" y2="11.5"  stroke="#6a88aa" stroke-width="0.3"/>
  <line x1="106" y1="8" x2="106" y2="11.5" stroke="#6a88aa" stroke-width="0.3"/>

  <!-- Wall panels - South (with door opening gap) -->
  <rect x="10"  y="124.5" width="44" height="3.5" class="wall-fill"/>
  <rect x="78"  y="124.5" width="52" height="3.5" class="wall-fill"/>

  <!-- Wall panels - West (with emergency door gap) -->
  <rect x="10"   y="11.5" width="3.5" height="26" class="wall-fill"/>
  <rect x="10"   y="51"   width="3.5" height="74" class="wall-fill"/>

  <!-- Wall panels - East (with sterile door gap) -->
  <rect x="126.5" y="11.5" width="3.5" height="30" class="wall-fill"/>
  <rect x="126.5" y="67"   width="3.5" height="62" class="wall-fill"/>

  <!-- Laminar Air Flow Zone -->
  <rect x="44" y="40" width="52" height="52" class="laminar" rx="0.5"/>
  <!-- LAF label background -->
  <rect x="46" y="30.5" width="48" height="8" fill="white" fill-opacity="0.9"/>
  <text x="70" y="37" text-anchor="middle" class="label-zone">LAMINAR ZONE</text>

  <!-- Operating Table -->
  <rect x="48" y="57" width="44" height="12" class="equipment" rx="0.5"/>
  <rect x="50" y="58.5" width="40" height="9" fill="none" stroke="#003366"
        stroke-width="0.3"/>
  <!-- Head end indicator -->
  <line x1="86" y1="58.5" x2="86" y2="67.5" stroke="#003366" stroke-width="0.5"/>
  <text x="70" y="73" text-anchor="middle" class="label">Operating Table</text>

  <!-- Shadowless Lamps — ceiling mount symbol -->
  <g transform="translate(57, 53)">
    <circle cx="0" cy="0" r="7" fill="none" stroke="#003366"
            stroke-width="0.35" stroke-dasharray="1.5,0.5"/>
    <circle cx="0" cy="0" r="4" fill="#fff9e8" stroke="#b8860b" stroke-width="0.4"/>
    <circle cx="0" cy="0" r="1.5" fill="#ffd54f"/>
  </g>
  <g transform="translate(83, 53)">
    <circle cx="0" cy="0" r="7" fill="none" stroke="#003366"
            stroke-width="0.35" stroke-dasharray="1.5,0.5"/>
    <circle cx="0" cy="0" r="4" fill="#fff9e8" stroke="#b8860b" stroke-width="0.4"/>
    <circle cx="0" cy="0" r="1.5" fill="#ffd54f"/>
  </g>
  <!-- Lamp label — ABOVE the lamp circles, OUTSIDE surgical zone -->
  <text x="70" y="44" text-anchor="middle" class="label-sm">Surgical Lamp (x2)</text>

  <!-- Pendant Left — schematic: ceiling circle + drop + unit -->
  <circle cx="25" cy="14.5" r="3.5" fill="none" stroke="#003366"
          stroke-width="0.4" stroke-dasharray="1,0.5"/>
  <line   x1="25" y1="18"   x2="25" y2="55" stroke="#003366" stroke-width="0.4"/>
  <rect   x="19" y="55" width="12" height="22" class="equipment" rx="0.5"/>
  <text   x="25" y="81" text-anchor="middle" class="label">Pendant</text>

  <!-- Pendant Right — schematic -->
  <circle cx="115" cy="14.5" r="3.5" fill="none" stroke="#003366"
          stroke-width="0.4" stroke-dasharray="1,0.5"/>
  <line   x1="115" y1="18"  x2="115" y2="55" stroke="#003366" stroke-width="0.4"/>
  <rect   x="109" y="55" width="12" height="22" class="equipment" rx="0.5"/>
  <text   x="115" y="81" text-anchor="middle" class="label">Pendant</text>

  <!-- Control Panel — North wall -->
  <rect x="16" y="11.5" width="16" height="11" class="equipment" rx="0.3"/>
  <rect x="17.5" y="13"  width="13" height="7.5" class="equip-dark" rx="0.2"/>
  <text x="24"  y="26"  text-anchor="middle" class="label">Control</text>

  <!-- X-Ray Viewer — North wall -->
  <rect x="40" y="11.5" width="20" height="11" class="equipment" rx="0.3"/>
  <rect x="41.5" y="13"   width="7.5" height="8" fill="#edf4fc"
        stroke="#003366" stroke-width="0.25" rx="0.2"/>
  <rect x="51"   y="13"   width="7.5" height="8" fill="#edf4fc"
        stroke="#003366" stroke-width="0.25" rx="0.2"/>
  <text x="50"   y="26"   text-anchor="middle" class="label">X-Ray</text>

  <!-- Main Entry Door — South wall (hermetic biparting) -->
  <rect x="54" y="124.5" width="24" height="3.5" class="door"/>
  <!-- Biparting indicator: two inward arrows -->
  <path d="M 62 126.2 L 57 126.2" stroke="#003366" stroke-width="0.5"
        fill="none" stroke-linecap="round"/>
  <polygon points="57,126.2 59.5,125.2 59.5,127.2" fill="#003366"/>
  <path d="M 70 126.2 L 75 126.2" stroke="#003366" stroke-width="0.5"
        fill="none" stroke-linecap="round"/>
  <polygon points="75,126.2 72.5,125.2 72.5,127.2" fill="#003366"/>
  <text x="66" y="132" text-anchor="middle" class="label">Main Entry</text>

  <!-- Emergency Door — West wall (single swing, arc) -->
  <rect x="10" y="37" width="3.5" height="14" class="door"/>
  <path d="M 13.5 37 A 14 14 0 0 1 13.5 51" class="door-arc"/>

  <!-- Sterile Door — East wall -->
  <rect x="126.5" y="37" width="3.5" height="30" class="door"/>
  <path d="M 126.5 41 L 126.5 37" stroke="#003366" stroke-width="0.4"
        stroke-dasharray="1,0.5"/>
  <path d="M 126.5 63 L 126.5 67" stroke="#003366" stroke-width="0.4"
        stroke-dasharray="1,0.5"/>

  <!-- Airflow arrows from ceiling (LAF supply) -->
  <path d="M 53 18 L 53 38" stroke="#0d9488" stroke-width="0.6"
        marker-end="url(#arrow-teal)" opacity="0.7"/>
  <path d="M 70 18 L 70 38" stroke="#0d9488" stroke-width="0.6"
        marker-end="url(#arrow-teal)" opacity="0.7"/>
  <path d="M 87 18 L 87 38" stroke="#0d9488" stroke-width="0.6"
        marker-end="url(#arrow-teal)" opacity="0.7"/>

  <!-- Scale bar -->
  <line x1="10" y1="142" x2="30" y2="142" stroke="#555" stroke-width="0.5"/>
  <line x1="10" y1="140" x2="10" y2="144" stroke="#555" stroke-width="0.5"/>
  <line x1="30" y1="140" x2="30" y2="144" stroke="#555" stroke-width="0.5"/>
  <text x="20" y="148" text-anchor="middle" class="label-sm">2 m</text>
  <text x="70" y="148" text-anchor="middle" class="label-sm">Scale 1:100 approx.</text>

  <!-- Legend -->
  <g transform="translate(10, 155)">
    <rect x="0" y="0" width="7" height="5" class="equipment"/>
    <text x="9" y="4.5" class="label-sm">Equipment</text>

    <circle cx="44" cy="2.5" r="3" fill="none" stroke="#003366"
            stroke-width="0.4" stroke-dasharray="1,0.5"/>
    <text x="49" y="4.5" class="label-sm">Ceiling Mount</text>

    <rect x="85" y="0" width="9" height="5" class="laminar"/>
    <text x="96" y="4.5" class="label-sm">Laminar Zone</text>

    <rect x="130" y="0" width="7" height="5" class="door"/>
    <text x="139" y="4.5" class="label-sm">Door</text>

    <text x="165" y="4.5" class="label-sm" fill="#555">6m x 6m</text>
  </g>
</svg>
