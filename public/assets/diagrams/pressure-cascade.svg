<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 450 180"
     width="100%" height="auto"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

  <defs>
    <marker id="arrow-navy" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#003366"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Title -->
  <text x="225" y="20" font-size="14" font-weight="700" fill="#003366" text-anchor="middle">PRESSURE CASCADE</text>
  <text x="225" y="34" font-size="9" fill="#64748b" text-anchor="middle">Positive Pressure Gradient &#x2014; Operating Theatre Suite</text>

  <!-- ==================== 4 Zones ==================== -->

  <!-- Zone 1: OR Room (+15 Pa) — darkest teal -->
  <rect x="20" y="50" width="100" height="80" fill="#0d9488" stroke="#003366" stroke-width="1.5" rx="4"/>
  <text x="70" y="72" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">OR ROOM</text>
  <text x="70" y="90" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">+15 Pa</text>
  <text x="70" y="105" font-size="7" fill="#ccfbf1" text-anchor="middle">18-24&#xB0;C</text>
  <text x="70" y="115" font-size="7" fill="#ccfbf1" text-anchor="middle">40-60% RH</text>
  <text x="70" y="125" font-size="7" fill="#ccfbf1" text-anchor="middle">ISO Class 5-7</text>

  <!-- Arrow → -->
  <line x1="120" y1="90" x2="130" y2="90" stroke="#003366" stroke-width="1.5" marker-end="url(#arrow-navy)"/>

  <!-- Zone 2: Scrub Area (+10 Pa) — medium teal -->
  <rect x="140" y="50" width="100" height="80" fill="#5eead4" stroke="#003366" stroke-width="1.5" rx="4"/>
  <text x="190" y="72" font-size="10" font-weight="700" fill="#003366" text-anchor="middle">SCRUB AREA</text>
  <text x="190" y="90" font-size="14" font-weight="700" fill="#003366" text-anchor="middle">+10 Pa</text>
  <text x="190" y="108" font-size="7" fill="#003366" text-anchor="middle">Preparation Zone</text>

  <!-- Arrow → -->
  <line x1="240" y1="90" x2="250" y2="90" stroke="#003366" stroke-width="1.5" marker-end="url(#arrow-navy)"/>

  <!-- Zone 3: Corridor (+5 Pa) — light teal -->
  <rect x="260" y="50" width="100" height="80" fill="#ccfbf1" stroke="#003366" stroke-width="1.5" rx="4"/>
  <text x="310" y="72" font-size="10" font-weight="700" fill="#003366" text-anchor="middle">CORRIDOR</text>
  <text x="310" y="90" font-size="14" font-weight="700" fill="#003366" text-anchor="middle">+5 Pa</text>
  <text x="310" y="108" font-size="7" fill="#64748b" text-anchor="middle">Clean Corridor</text>

  <!-- Arrow → -->
  <line x1="360" y1="90" x2="370" y2="90" stroke="#003366" stroke-width="1.5" marker-end="url(#arrow-navy)"/>

  <!-- Zone 4: External (0 Pa) — light gray -->
  <rect x="380" y="50" width="55" height="80" fill="#f1f5f9" stroke="#003366" stroke-width="1.5" rx="4"/>
  <text x="407" y="72" font-size="9" font-weight="700" fill="#003366" text-anchor="middle">EXT.</text>
  <text x="407" y="90" font-size="13" font-weight="700" fill="#64748b" text-anchor="middle">0 Pa</text>
  <text x="407" y="108" font-size="7" fill="#64748b" text-anchor="middle">Ambient</text>

  <!-- ==================== Gradient indicator bar ==================== -->
  <rect x="20" y="140" width="415" height="6" rx="3" fill="none" stroke="#003366" stroke-width="0.5"/>
  <rect x="20" y="140" width="104" height="6" rx="3" fill="#0d9488"/>
  <rect x="124" y="140" width="104" height="6" fill="#5eead4"/>
  <rect x="228" y="140" width="104" height="6" fill="#ccfbf1"/>
  <rect x="332" y="140" width="103" height="6" rx="3" fill="#f1f5f9"/>

  <text x="70" y="156" font-size="7" fill="#0d9488" text-anchor="middle" font-weight="600">Highest Pressure</text>
  <text x="407" y="156" font-size="7" fill="#64748b" text-anchor="middle">Ambient</text>

  <!-- ==================== Standard reference ==================== -->
  <text x="225" y="174" font-size="8" fill="#64748b" text-anchor="middle" font-style="italic">Standard per Permenkes No. 7 Tahun 2019</text>

</svg>
