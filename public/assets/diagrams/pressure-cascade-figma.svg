<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 450 200"
     width="100%" height="auto"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

  <defs>
    <!-- Arrow marker -->
    <marker id="cascade-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#003366"/>
    </marker>

    <!-- Zone shadows -->
    <filter id="zone-shadow" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#003366" flood-opacity="0.1"/>
    </filter>

    <!-- Gradient for the pressure bar indicator -->
    <linearGradient id="pressure-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="33%" stop-color="#5eead4"/>
      <stop offset="66%" stop-color="#ccfbf1"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="450" height="200" fill="#ffffff"/>

  <!-- ==================== TITLE ==================== -->
  <text x="225" y="17" font-size="12" font-weight="700" fill="#003366" text-anchor="middle" letter-spacing="-0.01em">OPERATING THEATRE PRESSURE CASCADE</text>
  <text x="225" y="29" font-size="7" fill="#64748b" text-anchor="middle">Positive Pressure Gradient: Clean to Uncontrolled Zones</text>

  <!-- Thin accent line under title -->
  <line x1="150" y1="33" x2="300" y2="33" stroke="#0d9488" stroke-width="0.8" opacity="0.35"/>

  <!-- ==================== PRESSURE LABELS (above boxes) ==================== -->
  <text x="67" y="49" font-size="12" font-weight="700" fill="#003366" text-anchor="middle">+15 Pa</text>
  <text x="174" y="49" font-size="12" font-weight="700" fill="#003366" text-anchor="middle">+10 Pa</text>
  <text x="281" y="49" font-size="12" font-weight="700" fill="#003366" text-anchor="middle">+5 Pa</text>
  <text x="388" y="49" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">0 Pa</text>

  <!-- Small pressure indicators (downward carets) -->
  <polygon points="67 51, 63 55, 71 55" fill="#0d9488" opacity="0.5"/>
  <polygon points="174 51, 170 55, 178 55" fill="#5eead4" opacity="0.5"/>
  <polygon points="281 51, 277 55, 285 55" fill="#ccfbf1" opacity="0.5"/>
  <polygon points="388 51, 384 55, 392 55" fill="#e2e8f0" opacity="0.5"/>

  <!-- ==================== ZONE 1: OR ROOM (dark teal) ==================== -->
  <rect x="20" y="58" width="95" height="92" fill="#0d9488" rx="6" filter="url(#zone-shadow)"/>
  <!-- Inner highlight -->
  <rect x="22" y="60" width="91" height="88" fill="none" stroke="#14b8a6" stroke-width="0.5" rx="5" opacity="0.3"/>

  <text x="67" y="78" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.02em">OR ROOM</text>
  <line x1="40" y1="83" x2="94" y2="83" stroke="#ffffff" stroke-width="0.4" opacity="0.3"/>
  <text x="67" y="96" font-size="7.5" fill="#ccfbf1" text-anchor="middle">ISO Class 5</text>
  <text x="67" y="108" font-size="7.5" fill="#ccfbf1" text-anchor="middle">18 &#x2013; 24&#xB0;C</text>
  <text x="67" y="120" font-size="7.5" fill="#ccfbf1" text-anchor="middle">40 &#x2013; 60% RH</text>
  <text x="67" y="132" font-size="7" fill="#99e0d5" text-anchor="middle" opacity="0.85">Laminar Airflow</text>
  <text x="67" y="143" font-size="6" fill="#99e0d5" text-anchor="middle" opacity="0.6">Highest Cleanliness</text>

  <!-- ==================== ARROW 1→2 ==================== -->
  <line x1="117" y1="104" x2="125" y2="104" stroke="#003366" stroke-width="1.5" marker-end="url(#cascade-arrow)"/>
  <text x="121" y="115" font-size="5.5" fill="#94a3b8" text-anchor="middle" font-style="italic">airflow</text>

  <!-- ==================== ZONE 2: SCRUB AREA (medium teal) ==================== -->
  <rect x="127" y="58" width="95" height="92" fill="#5eead4" rx="6" filter="url(#zone-shadow)"/>
  <rect x="129" y="60" width="91" height="88" fill="none" stroke="#99f6e4" stroke-width="0.5" rx="5" opacity="0.3"/>

  <text x="174" y="78" font-size="10" font-weight="700" fill="#003366" text-anchor="middle" letter-spacing="0.02em">SCRUB AREA</text>
  <line x1="147" y1="83" x2="201" y2="83" stroke="#003366" stroke-width="0.4" opacity="0.15"/>
  <text x="174" y="96" font-size="7.5" fill="#003366" text-anchor="middle">Preparation Zone</text>
  <text x="174" y="108" font-size="7.5" fill="#003366" text-anchor="middle">Scrub Station</text>
  <text x="174" y="120" font-size="7.5" fill="#003366" text-anchor="middle">SUS-304 Sink</text>
  <text x="174" y="132" font-size="7" fill="#003366" text-anchor="middle" opacity="0.6">Hand Hygiene</text>

  <!-- ==================== ARROW 2→3 ==================== -->
  <line x1="224" y1="104" x2="232" y2="104" stroke="#003366" stroke-width="1.5" marker-end="url(#cascade-arrow)"/>
  <text x="228" y="115" font-size="5.5" fill="#94a3b8" text-anchor="middle" font-style="italic">airflow</text>

  <!-- ==================== ZONE 3: CORRIDOR (light teal) ==================== -->
  <rect x="234" y="58" width="95" height="92" fill="#ccfbf1" stroke="#0d9488" stroke-width="0.5" rx="6" filter="url(#zone-shadow)"/>

  <text x="281" y="78" font-size="10" font-weight="700" fill="#003366" text-anchor="middle" letter-spacing="0.02em">CORRIDOR</text>
  <line x1="254" y1="83" x2="308" y2="83" stroke="#003366" stroke-width="0.4" opacity="0.1"/>
  <text x="281" y="96" font-size="7.5" fill="#003366" text-anchor="middle">Clean Zone</text>
  <text x="281" y="108" font-size="7.5" fill="#64748b" text-anchor="middle">Controlled Access</text>
  <text x="281" y="120" font-size="7.5" fill="#64748b" text-anchor="middle">Transfer Area</text>
  <text x="281" y="132" font-size="7" fill="#94a3b8" text-anchor="middle" opacity="0.7">Buffer Zone</text>

  <!-- ==================== ARROW 3→4 ==================== -->
  <line x1="331" y1="104" x2="339" y2="104" stroke="#003366" stroke-width="1.5" marker-end="url(#cascade-arrow)"/>
  <text x="335" y="115" font-size="5.5" fill="#94a3b8" text-anchor="middle" font-style="italic">airflow</text>

  <!-- ==================== ZONE 4: EXTERNAL (neutral) ==================== -->
  <rect x="341" y="58" width="95" height="92" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" rx="6" filter="url(#zone-shadow)"/>

  <text x="388" y="78" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="0.02em">EXTERNAL</text>
  <line x1="361" y1="83" x2="415" y2="83" stroke="#003366" stroke-width="0.4" opacity="0.08"/>
  <text x="388" y="96" font-size="7.5" fill="#64748b" text-anchor="middle">Uncontrolled</text>
  <text x="388" y="108" font-size="7.5" fill="#94a3b8" text-anchor="middle">Ambient Pressure</text>
  <text x="388" y="120" font-size="7" fill="#94a3b8" text-anchor="middle" opacity="0.6">No Classification</text>

  <!-- ==================== GRADIENT PRESSURE BAR ==================== -->
  <!-- Smooth gradient bar showing pressure transition -->
  <rect x="20" y="158" width="416" height="5" rx="2.5" fill="url(#pressure-bar)"/>

  <!-- Bar section borders (subtle) -->
  <line x1="115" y1="157" x2="115" y2="164" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="222" y1="157" x2="222" y2="164" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="329" y1="157" x2="329" y2="164" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Bar labels -->
  <text x="67" y="173" font-size="6" font-weight="600" fill="#0d9488" text-anchor="middle">Highest Pressure</text>
  <text x="225" y="173" font-size="5.5" fill="#94a3b8" text-anchor="middle">&#x2190;  Pressure Gradient  &#x2192;</text>
  <text x="388" y="173" font-size="6" fill="#94a3b8" text-anchor="middle">Ambient</text>

  <!-- ==================== FOOTER (WAJIB) ==================== -->
  <text x="225" y="190" font-size="7" fill="#94a3b8" text-anchor="middle" font-style="italic">Standard per Permenkes No. 7 Tahun 2019</text>

  <!-- Subtle bottom accent -->
  <line x1="155" y1="195" x2="295" y2="195" stroke="#0d9488" stroke-width="0.5" opacity="0.2"/>

</svg>
