<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240">
  <!--
    OR Room Isometric Schematic v2 — Enhanced Cleanroom BIM Style
    Axonometric projection (original coords preserved via scale wrapper):
    cx=140 cy=85 scale=14 scale_z=18
    Formula: px = 140 + (x-y)*12.12   py = 85 + (x+y)*7 - z*18
    Room: 6m × 6m × 3m
    v2: gradient walls, LAF crosshatch, pendant arms, control panel, RAG grilles, leader lines
    All existing elements wrapped in <g transform="scale(1.214) translate(0,0)">
    New elements added inside same transform wrapper (original coord space).
  -->

  <defs>
    <!-- Wall gradient fills — simulated lighting (light from left-top) -->
    <linearGradient id="wall-north-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#dde4ee"/>
      <stop offset="100%" stop-color="#b8c8d8"/>
    </linearGradient>
    <linearGradient id="wall-west-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#c8d8e8"/>
      <stop offset="100%" stop-color="#a8b8c8"/>
    </linearGradient>
    <linearGradient id="ceiling-grad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#eef2f8"/>
      <stop offset="100%" stop-color="#d8e0ec"/>
    </linearGradient>
    <!-- LAF crosshatch pattern -->
    <pattern id="laf-hatch" patternUnits="userSpaceOnUse" width="4" height="4"
             patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#0d9488" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <!-- Airflow arrowhead (downward) for LAF laminar stream -->
    <marker id="airflow-arrow" viewBox="0 0 6 6" refX="3" refY="5"
            markerUnits="userSpaceOnUse" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L3,5 L6,0 L3,1.5 Z" fill="#0d9488" opacity="0.85"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="340" height="240" fill="#ffffff"/>

  <!-- ═══ SCALE(1.214) WRAPPER — all original + new elements ═══ -->
  <g transform="scale(1.214)">

    <!-- CEILING (drawn first — back surface) -->
    <polygon points="140,31 212.7,73 140,115 67.3,73"
             fill="url(#ceiling-grad)" stroke="#334155" stroke-width="0.8"/>

    <!-- LAF DIFFUSER ZONE on ceiling — HEPA filter module with 3x3 cell grid
         Outer frame: (0.8,0.8,3) (3.2,0.8,3) (3.2,3.2,3) (0.8,3.2,3) — 2.4m square -->
    <polygon points="140,42.2 169.1,59 140,75.8 110.9,59"
             fill="url(#laf-hatch)" stroke="#0d9488" stroke-width="2"/>
    <!-- 3x3 grid: vertical lines (y-direction) at x=1.6, 2.4 -->
    <line x1="149.7" y1="47.8" x2="120.6" y2="64.6" stroke="#0d9488" stroke-width="0.6" opacity="0.7"/>
    <line x1="159.4" y1="53.4" x2="130.3" y2="70.2" stroke="#0d9488" stroke-width="0.6" opacity="0.7"/>
    <!-- 3x3 grid: horizontal lines (x-direction) at y=1.6, 2.4 -->
    <line x1="130.3" y1="47.8" x2="159.4" y2="64.6" stroke="#0d9488" stroke-width="0.6" opacity="0.7"/>
    <line x1="120.6" y1="53.4" x2="149.7" y2="70.2" stroke="#0d9488" stroke-width="0.6" opacity="0.7"/>

    <!-- NORTH WALL (y=0, right visible face) — gradient fill -->
    <polygon points="140,85 212.7,127 212.7,73 140,31"
             fill="url(#wall-north-grad)" stroke="#334155" stroke-width="1"/>
    <!-- Panel joints at x=2 and x=4 -->
    <line x1="164.2" y1="99"  x2="164.2" y2="45"  stroke="#8aaccf" stroke-width="0.5" stroke-dasharray="2,1"/>
    <line x1="188.5" y1="113" x2="188.5" y2="59"  stroke="#8aaccf" stroke-width="0.5" stroke-dasharray="2,1"/>

    <!-- CONTROL PANEL on north wall (x=4.5→5.5, y=0, z=0.8→1.6) -->
    <!-- Corner (4.5,0,0.8): px=140+(4.5-0)*12.12=194.5, py=85+(4.5+0)*7-0.8*18=103.1 -->
    <!-- Corner (5.5,0,0.8): px=140+(5.5-0)*12.12=206.7, py=85+(5.5+0)*7-0.8*18=111.7 -->
    <!-- Corner (5.5,0,1.6): px=140+(5.5-0)*12.12=206.7, py=85+(5.5+0)*7-1.6*18=97.3 -->
    <!-- Corner (4.5,0,1.6): px=140+(4.5-0)*12.12=194.5, py=85+(4.5+0)*7-1.6*18=88.7 -->
    <polygon points="194.5,103.1 206.7,111.7 206.7,97.3 194.5,88.7"
             fill="#1e3a5f" stroke="#334155" stroke-width="0.7"/>
    <!-- Horizontal lines simulating monitor/switches -->
    <line x1="196" y1="92"  x2="205" y2="97.5"  stroke="#4a7fa8" stroke-width="0.5" stroke-dasharray="1.5,1"/>
    <line x1="196" y1="96"  x2="205" y2="101.5" stroke="#4a7fa8" stroke-width="0.5" stroke-dasharray="1.5,1"/>
    <line x1="196" y1="100" x2="205" y2="105.5" stroke="#4a7fa8" stroke-width="0.5" stroke-dasharray="1.5,1"/>
    <!-- Control Panel label via leader line -->
    <line x1="205" y1="100" x2="216" y2="97" stroke="#64748b" stroke-width="0.4"/>
    <text x="218" y="99" font-family="Arial,sans-serif" font-size="5.5"
          fill="#334155" text-anchor="start">Control</text>
    <text x="218" y="104" font-family="Arial,sans-serif" font-size="5.5"
          fill="#334155" text-anchor="start">Panel</text>

    <!-- WEST WALL left section (x=0, y=0→2) — gradient fill -->
    <polygon points="140,85 115.8,99 115.8,45 140,31"
             fill="url(#wall-west-grad)" stroke="#334155" stroke-width="1"/>
    <line x1="127.9" y1="92" x2="127.9" y2="38"  stroke="#8aaccf" stroke-width="0.5" stroke-dasharray="2,1"/>

    <!-- WEST WALL right section (x=0, y=4→6) — gradient fill -->
    <polygon points="91.5,113 67.3,127 67.3,73 91.5,59"
             fill="url(#wall-west-grad)" stroke="#334155" stroke-width="1"/>
    <line x1="79.4" y1="120" x2="79.4" y2="66"  stroke="#8aaccf" stroke-width="0.5" stroke-dasharray="2,1"/>

    <!-- RETURN AIR GRILLES on west wall — low position, y=1 z=0.3 and y=5 z=0.3 -->
    <!-- RAG 1: (0,1,0.3) → corners of small box (0→0.6, 1→1.6, z=0.1→0.5) -->
    <!-- Approx: center near (0,1,0.3): px=140+(0-1)*12.12=127.9, py=85+(0+1)*7-0.3*18=86.6 -->
    <!-- Small louvre box on left section of west wall -->
    <rect x="123" y="84" width="7" height="5" fill="none" stroke="#64748b" stroke-width="0.5"/>
    <line x1="124.2" y1="84" x2="124.2" y2="89" stroke="#64748b" stroke-width="0.3"/>
    <line x1="125.7" y1="84" x2="125.7" y2="89" stroke="#64748b" stroke-width="0.3"/>
    <line x1="127.2" y1="84" x2="127.2" y2="89" stroke="#64748b" stroke-width="0.3"/>
    <line x1="128.7" y1="84" x2="128.7" y2="89" stroke="#64748b" stroke-width="0.3"/>
    <text x="120" y="83" font-family="Arial,sans-serif" font-size="4.5"
          fill="#64748b" text-anchor="middle">RAG</text>

    <!-- RAG 2: (0,5,0.3): px=140+(0-5)*12.12=79.4, py=85+(0+5)*7-0.3*18=114.1 -->
    <rect x="75" y="112" width="7" height="5" fill="none" stroke="#64748b" stroke-width="0.5"/>
    <line x1="76.2" y1="112" x2="76.2" y2="117" stroke="#64748b" stroke-width="0.3"/>
    <line x1="77.7" y1="112" x2="77.7" y2="117" stroke="#64748b" stroke-width="0.3"/>
    <line x1="79.2" y1="112" x2="79.2" y2="117" stroke="#64748b" stroke-width="0.3"/>
    <line x1="80.7" y1="112" x2="80.7" y2="117" stroke="#64748b" stroke-width="0.3"/>
    <text x="72" y="111" font-family="Arial,sans-serif" font-size="4.5"
          fill="#64748b" text-anchor="middle">RAG</text>

    <!-- FLOOR (drawn after walls so floor covers wall bases) -->
    <polygon points="140,85 212.7,127 140,169 67.3,127"
             fill="#f0f4f8" stroke="#334155" stroke-width="0.8"/>
    <!-- Floor grid x-lines -->
    <line x1="152.1" y1="92"  x2="79.4"  y2="134" stroke="#c5cfe0" stroke-width="0.3"/>
    <line x1="164.2" y1="99"  x2="91.5"  y2="141" stroke="#c5cfe0" stroke-width="0.3"/>
    <line x1="176.4" y1="106" x2="103.6" y2="148" stroke="#c5cfe0" stroke-width="0.3"/>
    <line x1="188.5" y1="113" x2="115.8" y2="155" stroke="#c5cfe0" stroke-width="0.3"/>
    <line x1="200.6" y1="120" x2="127.9" y2="162" stroke="#c5cfe0" stroke-width="0.3"/>
    <!-- Floor grid y-lines -->
    <line x1="127.9" y1="92"  x2="200.6" y2="134" stroke="#c5cfe0" stroke-width="0.3"/>
    <line x1="115.8" y1="99"  x2="188.5" y2="141" stroke="#c5cfe0" stroke-width="0.3"/>
    <line x1="103.6" y1="106" x2="176.4" y2="148" stroke="#c5cfe0" stroke-width="0.3"/>
    <line x1="91.5"  y1="113" x2="164.2" y2="155" stroke="#c5cfe0" stroke-width="0.3"/>
    <line x1="79.4"  y1="120" x2="152.1" y2="162" stroke="#c5cfe0" stroke-width="0.3"/>
    <!-- LAF zone floor highlight (ISO Cl.5 surgical field) -->
    <polygon points="140,96.2 169.1,113 140,129.8 110.9,113"
             fill="#0d9488" fill-opacity="0.07" stroke="#0d9488"
             stroke-width="0.5" stroke-dasharray="3,1.5"/>

    <!-- LAF AIRFLOW ARROWS — laminar downward streams from diffuser to surgical field
         3 streams positioned to avoid op. table, lamp, and pendant arms.
         Start near ceiling diffuser (z=3, y=75.8 area), end near floor LAF zone (z=0). -->
    <line x1="125"   y1="68" x2="125"   y2="105" stroke="#0d9488" stroke-width="0.7"
          opacity="0.55" stroke-dasharray="2,2" marker-end="url(#airflow-arrow)"/>
    <line x1="155"   y1="68" x2="155"   y2="105" stroke="#0d9488" stroke-width="0.7"
          opacity="0.55" stroke-dasharray="2,2" marker-end="url(#airflow-arrow)"/>
    <line x1="140"   y1="55" x2="140"   y2="96"  stroke="#0d9488" stroke-width="0.7"
          opacity="0.55" stroke-dasharray="2,2" marker-end="url(#airflow-arrow)"/>

    <!-- ─────────────────────────────────────────
         OPERATING TABLE — 3-tier construction (real OR table profile)
         Pad (top, surgical surface):  x=2→4,    y=2.85→3.15, z=0.7→0.8
         Pedestal (column):            x=2.85→3.15, y=2.85→3.15, z=0.15→0.7
         Base (foot, weighted plate):  x=2.5→3.5, y=2.7→3.3,   z=0→0.15
         Drawn back-to-front for proper occlusion: base, pedestal, pad. -->

    <!-- BASE FOOT (z=0→0.15) -->
    <!-- top -->
    <polygon points="137.6,118.7 149.7,125.7 142.4,129.9 130.3,122.9"
             fill="#b8cad8" stroke="#003366" stroke-width="0.7"/>
    <!-- front face (y=3.3) -->
    <polygon points="130.3,122.9 142.4,129.9 142.4,132.6 130.3,125.6"
             fill="#a8bcc8" stroke="#003366" stroke-width="0.7"/>
    <!-- right face (x=3.5) -->
    <polygon points="149.7,125.7 142.4,129.9 142.4,132.6 149.7,128.4"
             fill="#9eb2c0" stroke="#003366" stroke-width="0.7"/>

    <!-- PEDESTAL COLUMN (z=0.15→0.7) — narrow square stem -->
    <!-- front face (y=3.15) -->
    <polygon points="136.4,114.4 140,116.5 140,126.4 136.4,124.3"
             fill="#a8bcc8" stroke="#003366" stroke-width="0.6"/>
    <!-- right face (x=3.15) -->
    <polygon points="143.6,114.4 140,116.5 140,126.4 143.6,124.3"
             fill="#98aebc" stroke="#003366" stroke-width="0.6"/>

    <!-- PAD / SURGICAL SURFACE (z=0.7→0.8) — long thin slab -->
    <!-- top -->
    <polygon points="129.7,104.55 153.9,118.55 150.3,120.65 126.06,106.65"
             fill="#dde8f4" stroke="#003366" stroke-width="0.8"/>
    <!-- front face (y=3.15) -->
    <polygon points="126.06,106.65 150.3,120.65 150.3,122.45 126.06,108.45"
             fill="#c8d8e8" stroke="#003366" stroke-width="0.8"/>
    <!-- right face (x=4) -->
    <polygon points="153.9,118.55 150.3,120.65 150.3,122.45 153.9,120.35"
             fill="#b8cad8" stroke="#003366" stroke-width="0.8"/>

    <!-- Table label with leader line (placed to upper-right, away from "6 m" floor dim) -->
    <line x1="151" y1="120" x2="170" y2="118" stroke="#64748b" stroke-width="0.4"/>
    <text x="172" y="120" font-family="Arial,sans-serif" font-size="6"
          fill="#003366" text-anchor="start">Op. Table</text>

    <!-- ─────────────────────────────────────────
         MEDICAL PENDANTS — 2 ceiling-mounted units flanking the surgical field
         Pendant 1 (surgeon side):    mount (2.0, 2.4, 3) → body at z=1.7
         Pendant 2 (anesthesia side): mount (4.0, 2.4, 3) → body at z=1.7
         Heads positioned at y=2.4 (north of surgical zone) so they do not
         intersect Op. Table or shadowless lamps. -->

    <!-- Pendant 1: ceiling mount disk + vertical pipe + head ellipse -->
    <!-- Mount (2.0, 2.4, 3):     px=135.15, py=61.8 -->
    <!-- Head  (2.0, 2.4, 1.7):   px=135.15, py=85.2 -->
    <ellipse cx="135.15" cy="61.8" rx="2.4" ry="1.1"
             fill="#94a3b8" stroke="#003366" stroke-width="0.5"/>
    <line x1="135.15" y1="62.5" x2="135.15" y2="84.2"
          stroke="#334155" stroke-width="1"/>
    <!-- Pendant 1 head: small disc body -->
    <ellipse cx="135.15" cy="85.2" rx="3.4" ry="1.8"
             fill="#c8d8e8" stroke="#003366" stroke-width="0.7"/>
    <ellipse cx="135.15" cy="85.2" rx="2.2" ry="1.0" fill="none"
             stroke="#4a6582" stroke-width="0.4"/>

    <!-- Pendant 2: same construction, mount (4.0, 2.4, 3) -->
    <!-- Mount (4.0, 2.4, 3):     px=159.4, py=75.8 -->
    <!-- Head  (4.0, 2.4, 1.7):   px=159.4, py=99.2 -->
    <ellipse cx="159.4" cy="75.8" rx="2.4" ry="1.1"
             fill="#94a3b8" stroke="#003366" stroke-width="0.5"/>
    <line x1="159.4" y1="76.5" x2="159.4" y2="98.2"
          stroke="#334155" stroke-width="1"/>
    <ellipse cx="159.4" cy="99.2" rx="3.4" ry="1.8"
             fill="#c8d8e8" stroke="#003366" stroke-width="0.7"/>
    <ellipse cx="159.4" cy="99.2" rx="2.2" ry="1.0" fill="none"
             stroke="#4a6582" stroke-width="0.4"/>

    <!-- Pendant label — placed between two pendants, leader pointing to pendant 1 head -->
    <text x="146" y="76" font-family="Arial,sans-serif" font-size="5.5"
          fill="#334155" text-anchor="middle">Pendant</text>
    <line x1="143" y1="78" x2="138" y2="84" stroke="#64748b" stroke-width="0.4"/>

    <!-- SHADOWLESS LAMPS (at z=2.3) -->
    <line x1="133.9" y1="76.1" x2="133.9" y2="69.5" stroke="#8a9ab0" stroke-width="0.6"/>
    <line x1="146.1" y1="83.1" x2="146.1" y2="69.5" stroke="#8a9ab0" stroke-width="0.6"/>
    <circle cx="133.9" cy="82.1" r="5.5" fill="#fff9e8" stroke="#b8860b" stroke-width="0.7"/>
    <circle cx="133.9" cy="82.1" r="2.5" fill="#ffd54f"/>
    <circle cx="146.1" cy="89.1" r="5.5" fill="#fff9e8" stroke="#b8860b" stroke-width="0.7"/>
    <circle cx="146.1" cy="89.1" r="2.5" fill="#ffd54f"/>

    <!-- ACCESS DOOR on west wall (x=0, y=2→4, z=0→2.1) -->
    <polygon points="115.8,99 91.5,113 91.5,75.2 115.8,61.2"
             fill="#d0eaf5" stroke="#2a6fa8" stroke-width="0.7"/>
    <line x1="113.8" y1="63"  x2="93.5"  y2="75"  stroke="#2a6fa8" stroke-width="0.3" stroke-dasharray="1.5,1"/>
    <line x1="93.5"  y1="75"  x2="93.5"  y2="111" stroke="#2a6fa8" stroke-width="0.3" stroke-dasharray="1.5,1"/>
    <!-- Door label -->
    <text x="94"  y="89" font-family="Arial,sans-serif" font-size="6"
          fill="#2a6fa8" text-anchor="middle">Access</text>
    <text x="94"  y="94" font-family="Arial,sans-serif" font-size="6"
          fill="#2a6fa8" text-anchor="middle">Door</text>

    <!-- LAF DIFFUSER label with leader line -->
    <!-- Move text to upper-left of LAF polygon, draw leader to polygon centroid -->
    <line x1="115" y1="52" x2="130" y2="58" stroke="#64748b" stroke-width="0.4"/>
    <text x="113" y="50" font-family="Arial,sans-serif" font-size="7"
          fill="#0d9488" text-anchor="end" font-weight="bold">LAF DIFFUSER</text>
    <text x="113" y="57" font-family="Arial,sans-serif" font-size="6"
          fill="#0d9488" text-anchor="end">2400×2400 mm · HEPA H14</text>

    <!-- DIMENSION ANNOTATIONS -->
    <!-- Wall height 3m: dimension line right of north wall.
         Label placed ABOVE the line (text-anchor middle) to avoid Control Panel labels. -->
    <line x1="222" y1="73"  x2="222" y2="127" stroke="#334155" stroke-width="0.5"/>
    <line x1="220" y1="73"  x2="224" y2="73"  stroke="#334155" stroke-width="0.5"/>
    <line x1="220" y1="127" x2="224" y2="127" stroke="#334155" stroke-width="0.5"/>
    <text x="222" y="71" font-family="Arial,sans-serif" font-size="6"
          fill="#334155" text-anchor="middle">3 m</text>

    <!-- Floor dimensions -->
    <text x="188" y="133" font-family="Arial,sans-serif" font-size="6"
          fill="#334155" text-anchor="middle">6 m</text>
    <text x="93"  y="133" font-family="Arial,sans-serif" font-size="6"
          fill="#334155" text-anchor="middle">6 m</text>

    <!-- Scale bar -->
    <line x1="228" y1="162" x2="240.1" y2="169" stroke="#334155" stroke-width="1.2"/>
    <line x1="228" y1="159" x2="228"   y2="165" stroke="#334155" stroke-width="0.8"/>
    <line x1="240.1" y1="166" x2="240.1" y2="172" stroke="#334155" stroke-width="0.8"/>
    <text x="234" y="178" font-family="Arial,sans-serif" font-size="6"
          fill="#334155" text-anchor="middle">1 m</text>

    <!-- TITLE -->
    <text x="140" y="10" font-family="Arial,sans-serif" font-size="8"
          fill="#003366" text-anchor="middle" font-weight="bold">OPERATING THEATRE: ISOMETRIC SCHEMATIC</text>

    <!-- LEGEND (bottom left) -->
    <rect x="4" y="150" width="68" height="46" fill="white" fill-opacity="0.9"
          stroke="#e2e8f0" stroke-width="0.5" rx="1"/>
    <!-- LAF Zone -->
    <polygon points="6,154 11,154 11,159 6,159" fill="url(#laf-hatch)" stroke="#0d9488" stroke-width="0.5"/>
    <text x="14" y="159" font-family="Arial,sans-serif" font-size="6" fill="#334155">LAF Zone (ISO Cl.5)</text>
    <!-- Op Table -->
    <polygon points="6,162 11,162 11,167 6,167" fill="#c8d8e8" stroke="#003366" stroke-width="0.5"/>
    <text x="14" y="167" font-family="Arial,sans-serif" font-size="6" fill="#334155">Operating Table</text>
    <!-- Lamp -->
    <circle cx="8.5" cy="174" r="2.5" fill="#fff9e8" stroke="#b8860b" stroke-width="0.5"/>
    <circle cx="8.5" cy="174" r="1"   fill="#ffd54f"/>
    <text x="14" y="176" font-family="Arial,sans-serif" font-size="6" fill="#334155">Shadowless Lamp</text>
    <!-- Door -->
    <polygon points="6,180 11,180 11,187 6,187" fill="#d0eaf5" stroke="#2a6fa8" stroke-width="0.5"/>
    <text x="14" y="185" font-family="Arial,sans-serif" font-size="6" fill="#334155">Access Door</text>

  </g><!-- end scale wrapper -->

</svg>
