<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <!-- Filter media screen pattern (HEPA) -->
    <pattern id="filter-screen" patternUnits="userSpaceOnUse" width="5" height="5">
      <line x1="0" y1="0" x2="0" y2="5"   stroke="#ffffff" stroke-width="0.8"
            stroke-opacity="0.25"/>
      <line x1="2.5" y1="0" x2="2.5" y2="5" stroke="#ffffff" stroke-width="0.8"
            stroke-opacity="0.25"/>
    </pattern>
    <!-- LAF diffuser perforated pattern -->
    <pattern id="diffuser-perf" patternUnits="userSpaceOnUse" width="6" height="6">
      <circle cx="3" cy="3" r="1" fill="rgba(255,255,255,0.3)"/>
    </pattern>
    <!-- Supply air arrow -->
    <marker id="arr-supply" markerWidth="6" markerHeight="5"
            refX="0" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#0d9488"/>
    </marker>
    <!-- Return air arrow -->
    <marker id="arr-return" markerWidth="6" markerHeight="5"
            refX="0" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#b8860b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="400" height="320" fill="#ffffff"/>

  <!-- Title -->
  <text x="200" y="22" font-family="Arial, sans-serif" font-size="12"
        font-weight="bold" fill="#003366" text-anchor="middle"
        letter-spacing="0.04em">HVAC AIRFLOW DIRECTION</text>
  <text x="200" y="36" font-family="Arial, sans-serif" font-size="9"
        fill="#64748b" text-anchor="middle">Operating Theatre Ventilation System</text>
  <line x1="60" y1="40" x2="340" y2="40" stroke="#003366" stroke-width="0.5"/>

  <!-- "From AHU" input indicator -->
  <text x="298" y="53" font-family="Arial, sans-serif" font-size="8"
        fill="#64748b" text-anchor="end">From AHU</text>
  <line x1="195" y1="50" x2="260" y2="50" stroke="#64748b"
        stroke-width="0.6" stroke-dasharray="2,1.5"/>

  <!-- HEPA H14 Filter — with screen pattern indicating filter media -->
  <rect x="120" y="55" width="160" height="28" fill="#003366" stroke="#002244"
        stroke-width="1"/>
  <rect x="120" y="55" width="160" height="28" fill="url(#filter-screen)"/>
  <text x="200" y="68" font-family="Arial, sans-serif" font-size="10"
        font-weight="bold" fill="#ffffff" text-anchor="middle"
        letter-spacing="0.04em">HEPA H14 FILTER</text>
  <text x="200" y="80" font-family="Arial, sans-serif" font-size="8"
        fill="#64748b" text-anchor="middle">99.99% efficiency (H14)</text>

  <!-- LAF Diffuser — with perforated pattern indicating diffuser surface -->
  <rect x="80"  y="92" width="240" height="28" fill="#0d9488" stroke="#0a7c71"
        stroke-width="1"/>
  <rect x="80"  y="92" width="240" height="28" fill="url(#diffuser-perf)"/>
  <text x="200" y="108" font-family="Arial, sans-serif" font-size="10"
        font-weight="bold" fill="#ffffff" text-anchor="middle"
        letter-spacing="0.03em">LAMINAR AIR DIFFUSER</text>
  <text x="200" y="132" font-family="Arial, sans-serif" font-size="8.5"
        fill="#003366" text-anchor="middle">2400 x 2400 mm, Unidirectional Flow</text>

  <!-- Supply air columns (laminar flow indicator) -->
  <line x1="125" y1="143" x2="125" y2="162" stroke="#0d9488" stroke-width="1.5"
        marker-end="url(#arr-supply)"/>
  <line x1="160" y1="143" x2="160" y2="162" stroke="#0d9488" stroke-width="1.5"
        marker-end="url(#arr-supply)"/>
  <line x1="200" y1="143" x2="200" y2="162" stroke="#0d9488" stroke-width="1.5"
        marker-end="url(#arr-supply)"/>
  <line x1="240" y1="143" x2="240" y2="162" stroke="#0d9488" stroke-width="1.5"
        marker-end="url(#arr-supply)"/>
  <line x1="275" y1="143" x2="275" y2="162" stroke="#0d9488" stroke-width="1.5"
        marker-end="url(#arr-supply)"/>
  <rect x="145" y="166" width="110" height="14" fill="white" fill-opacity="0.9"/>
  <text x="200" y="176" font-family="Arial, sans-serif" font-size="8.5"
        fill="#0d9488" text-anchor="middle" font-weight="bold">
    Supply Air (0.25-0.45 m/s)
  </text>

  <!-- Surgical Zone Box — prominent border + ISO class badge -->
  <rect x="90" y="188" width="220" height="62" fill="#f8fbff"
        stroke="#003366" stroke-width="2"/>
  <text x="200" y="213" font-family="Arial, sans-serif" font-size="12"
        font-weight="bold" fill="#003366" text-anchor="middle"
        letter-spacing="0.03em">SURGICAL ZONE</text>
  <!-- ISO class badge -->
  <rect x="150" y="218" width="100" height="16" fill="#003366" rx="2"/>
  <text x="200" y="229" font-family="Arial, sans-serif" font-size="8.5"
        font-weight="bold" fill="#0d9488" text-anchor="middle">
    ISO Class 5 (Class 100)
  </text>

  <!-- Return air — floor level flows to RAGs -->
  <line x1="83"  y1="264" x2="40"  y2="264" stroke="#b8860b" stroke-width="1.5"
        marker-end="url(#arr-return)"/>
  <line x1="317" y1="264" x2="360" y2="264" stroke="#b8860b" stroke-width="1.5"
        marker-end="url(#arr-return)"/>
  <text x="200" y="276" font-family="Arial, sans-serif" font-size="8"
        fill="#b8860b" text-anchor="middle">Return Air (floor level)</text>

  <!-- Return Air Grilles (RAG) -->
  <rect x="5"   y="272" width="55" height="30" fill="#eef2f6" stroke="#003366"
        stroke-width="0.8"/>
  <text x="32"  y="285" font-family="Arial, sans-serif" font-size="8"
        font-weight="bold" fill="#003366" text-anchor="middle">RAG</text>
  <text x="32"  y="295" font-family="Arial, sans-serif" font-size="7"
        fill="#64748b" text-anchor="middle">600x400mm</text>

  <rect x="340" y="272" width="55" height="30" fill="#eef2f6" stroke="#003366"
        stroke-width="0.8"/>
  <text x="368" y="285" font-family="Arial, sans-serif" font-size="8"
        font-weight="bold" fill="#003366" text-anchor="middle">RAG</text>
  <text x="368" y="295" font-family="Arial, sans-serif" font-size="7"
        fill="#64748b" text-anchor="middle">600x400mm</text>

  <!-- Floor line -->
  <line x1="5" y1="302" x2="395" y2="302" stroke="#003366" stroke-width="1.5"/>
  <text x="200" y="314" font-family="Arial, sans-serif" font-size="7.5"
        fill="#64748b" text-anchor="middle">Floor Level (±15cm from grille)</text>
</svg>
