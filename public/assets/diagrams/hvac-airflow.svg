<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 350" width="450" height="350">
  <!-- HVAC Airflow Direction Diagram -->
  
  <!-- Background -->
  <rect x="0" y="0" width="450" height="350" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="225" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#003366" text-anchor="middle">HVAC AIRFLOW DIRECTION</text>
  <text x="225" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Operating Theatre Ventilation System</text>
  
  <!-- HEPA Filter Box -->
  <rect x="150" y="55" width="150" height="25" fill="#003366" stroke="#003366" stroke-width="1"/>
  <text x="225" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">HEPA H14 FILTER</text>
  <text x="225" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" fill="#64748b" text-anchor="middle">99.99% efficiency</text>
  
  <!-- Laminar Diffuser -->
  <rect x="100" y="105" width="250" height="30" fill="#0d9488" stroke="#003366" stroke-width="1"/>
  <text x="225" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">LAMINAR AIR DIFFUSER</text>
  <text x="225" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#003366" text-anchor="middle">2400 × 2400 mm</text>
  
  <!-- Downward arrows (supply air) -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0d9488"/>
    </marker>
  </defs>
  
  <line x1="150" y1="160" x2="150" y2="175" stroke="#0d9488" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="185" y1="160" x2="185" y2="175" stroke="#0d9488" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="225" y1="160" x2="225" y2="175" stroke="#0d9488" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="265" y1="160" x2="265" y2="175" stroke="#0d9488" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="300" y1="160" x2="300" y2="175" stroke="#0d9488" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Background rect for readability -->
  <rect x="140" y="182" width="170" height="18" fill="white" opacity="0.9" rx="2"/>
  <text x="225" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#0d9488" text-anchor="middle" font-weight="bold">Supply Air (0.25–0.45 m/s)</text>
  
  <!-- Surgical Zone Box -->
  <rect x="120" y="210" width="210" height="60" fill="#f8fafc" stroke="#003366" stroke-width="2"/>
  <text x="225" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#003366" text-anchor="middle">SURGICAL ZONE</text>
  <text x="225" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#0d9488" text-anchor="middle">ISO Class 5 (Class 100)</text>
  
  <!-- Sideways airflow arrows -->
  <defs>
    <marker id="arrowleft" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#b8860b"/>
    </marker>
    <marker id="arrowright" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#b8860b"/>
    </marker>
  </defs>
  
  <line x1="115" y1="280" x2="65" y2="280" stroke="#b8860b" stroke-width="2" marker-end="url(#arrowleft)"/>
  <line x1="335" y1="280" x2="385" y2="280" stroke="#b8860b" stroke-width="2" marker-end="url(#arrowright)"/>
  
  <text x="225" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" fill="#b8860b" text-anchor="middle">Return Air (floor level)</text>
  
  <!-- Return Air Grilles -->
  <rect x="25" y="300" width="70" height="35" fill="#e2e8f0" stroke="#003366" stroke-width="1"/>
  <text x="60" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" font-weight="bold" fill="#003366" text-anchor="middle">RAG</text>
  <text x="60" y="327" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="7" fill="#64748b" text-anchor="middle">600×400mm</text>
  
  <rect x="355" y="300" width="70" height="35" fill="#e2e8f0" stroke="#003366" stroke-width="1"/>
  <text x="390" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" font-weight="bold" fill="#003366" text-anchor="middle">RAG</text>
  <text x="390" y="327" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="7" fill="#64748b" text-anchor="middle">600×400mm</text>
  
  <!-- Floor line -->
  <line x1="15" y1="335" x2="435" y2="335" stroke="#003366" stroke-width="2"/>
  <text x="225" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Floor Level (±15cm from grille)</text>
</svg>
