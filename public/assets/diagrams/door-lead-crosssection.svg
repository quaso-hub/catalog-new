<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 350 180"
     width="100%" height="auto"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

  <defs>
    <marker id="arrow-navy" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#003366"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Title -->
  <text x="175" y="18" font-size="14" font-weight="700" fill="#003366" text-anchor="middle">DOOR CROSS-SECTION WITH LEAD</text>
  <text x="175" y="30" font-size="8" fill="#64748b" text-anchor="middle">Automatic Swing PB/Lead Door &#x2014; Exploded Layers View</text>

  <!-- ==================== Exploded layers (left to right) ==================== -->
  <!-- Layer 1: SS Outer (1.5-2mm) -->
  <rect x="20" y="45" width="20" height="80" fill="#d1d5db" stroke="#003366" stroke-width="1.5" rx="1"/>
  <text x="30" y="135" font-size="8" font-weight="600" fill="#003366" text-anchor="middle">SS Outer</text>
  <text x="30" y="146" font-size="7" fill="#64748b" text-anchor="middle">1.5-2 mm</text>

  <!-- Gap indicator -->
  <line x1="45" y1="85" x2="55" y2="85" stroke="#64748b" stroke-width="0.5" stroke-dasharray="2,2"/>

  <!-- Layer 2: Pb Lead -->
  <rect x="60" y="45" width="30" height="80" fill="#94a3b8" stroke="#003366" stroke-width="1.5" rx="1"/>
  <text x="75" y="83" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">Pb</text>
  <text x="75" y="93" font-size="7" fill="#ffffff" text-anchor="middle">2 mm</text>
  <text x="75" y="135" font-size="8" font-weight="600" fill="#003366" text-anchor="middle">Lead</text>
  <text x="75" y="146" font-size="7" fill="#64748b" text-anchor="middle">Pb 2 mm</text>

  <!-- Gap indicator -->
  <line x1="95" y1="85" x2="105" y2="85" stroke="#64748b" stroke-width="0.5" stroke-dasharray="2,2"/>

  <!-- Layer 3: PIR Core + Plywood -->
  <rect x="110" y="45" width="60" height="80" fill="#fef3c7" stroke="#003366" stroke-width="1.5" rx="1"/>
  <text x="140" y="78" font-size="9" font-weight="600" fill="#003366" text-anchor="middle">PIR</text>
  <text x="140" y="90" font-size="7" fill="#64748b" text-anchor="middle">Insulation</text>
  <text x="140" y="102" font-size="7" fill="#64748b" text-anchor="middle">+ Plywood 9mm</text>
  <text x="140" y="112" font-size="7" fill="#64748b" text-anchor="middle">+ Rangka Hollow</text>
  <text x="140" y="135" font-size="8" font-weight="600" fill="#003366" text-anchor="middle">Core</text>

  <!-- Gap indicator -->
  <line x1="175" y1="85" x2="185" y2="85" stroke="#64748b" stroke-width="0.5" stroke-dasharray="2,2"/>

  <!-- Layer 4: Pb Lead (inner) -->
  <rect x="190" y="45" width="30" height="80" fill="#94a3b8" stroke="#003366" stroke-width="1.5" rx="1"/>
  <text x="205" y="83" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">Pb</text>
  <text x="205" y="93" font-size="7" fill="#ffffff" text-anchor="middle">2 mm</text>
  <text x="205" y="135" font-size="8" font-weight="600" fill="#003366" text-anchor="middle">Lead</text>
  <text x="205" y="146" font-size="7" fill="#64748b" text-anchor="middle">Pb 2 mm</text>

  <!-- Gap indicator -->
  <line x1="225" y1="85" x2="235" y2="85" stroke="#64748b" stroke-width="0.5" stroke-dasharray="2,2"/>

  <!-- Layer 5: SS Inner (1.2-1.5mm) -->
  <rect x="240" y="45" width="18" height="80" fill="#d1d5db" stroke="#003366" stroke-width="1.5" rx="1"/>
  <text x="249" y="135" font-size="8" font-weight="600" fill="#003366" text-anchor="middle">SS Inner</text>
  <text x="249" y="146" font-size="7" fill="#64748b" text-anchor="middle">1.2-1.5 mm</text>

  <!-- ==================== Total thickness dimension ==================== -->
  <line x1="20" y1="155" x2="258" y2="155" stroke="#003366" stroke-width="1"/>
  <line x1="20" y1="150" x2="20" y2="160" stroke="#003366" stroke-width="1"/>
  <line x1="258" y1="150" x2="258" y2="160" stroke="#003366" stroke-width="1"/>
  <rect x="110" y="150" width="58" height="14" fill="white" opacity="0.9"/>
  <text x="139" y="161" font-size="9" font-weight="700" fill="#003366" text-anchor="middle">&#xB1;45-50 mm</text>

  <!-- ==================== Side label ==================== -->
  <text x="290" y="68" font-size="7" fill="#64748b" text-anchor="start">Exterior</text>
  <text x="290" y="78" font-size="7" fill="#64748b" text-anchor="start">&#x2190;</text>
  <line x1="290" y1="85" x2="290" y2="85" stroke="#64748b"/>
  <text x="290" y="98" font-size="7" fill="#64748b" text-anchor="start">&#x2192;</text>
  <text x="290" y="108" font-size="7" fill="#64748b" text-anchor="start">Interior</text>

  <!-- Finishing note -->
  <text x="175" y="175" font-size="7" fill="#64748b" text-anchor="middle" font-style="italic">Finishing: Powder Coating Color / Stainless Steel | View Glass Timbal included</text>

</svg>
