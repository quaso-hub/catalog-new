<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#003366" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- L-shaped ruler with measurement ticks -->
  <path d="M3 21V3h18"/>
  <line x1="3" y1="21" x2="21" y2="21"/>
  <!-- Horizontal ticks (alternating long/short) -->
  <line x1="7" y1="3" x2="7" y2="5.5"/>
  <line x1="11" y1="3" x2="11" y2="5"/>
  <line x1="15" y1="3" x2="15" y2="5.5"/>
  <line x1="19" y1="3" x2="19" y2="5"/>
  <!-- Vertical ticks -->
  <line x1="3" y1="7" x2="5.5" y2="7"/>
  <line x1="3" y1="11" x2="5" y2="11"/>
  <line x1="3" y1="15" x2="5.5" y2="15"/>
  <line x1="3" y1="19" x2="5" y2="19"/>
  <!-- Dimension arrow indicator -->
  <line x1="8" y1="17" x2="18" y2="17" stroke-dasharray="1.5 2"/>
  <polyline points="9 15.5, 8 17, 9 18.5"/>
  <polyline points="17 15.5, 18 17, 17 18.5"/>
</svg>
